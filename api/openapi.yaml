        "description": "Lists memory_outcome evaluations whose target is this memory id (every revision), newest first by judged_at then evaluation id, with a summary over the same filters. Exact four-field scope from the storage layer; read:memories on scope and on the memory, read:evaluations on scope and on every returned evaluation, all the same principal; any denial returns no partial page. Only references, booleans, counts and times are returned: no memory, source, trace or checker text. Cursor is bound to scope and filters. Audited as read:memory_outcomes with the memory id only.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "workspace_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
