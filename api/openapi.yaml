      "post": {"summary": "One step of an MCP sign-in (mcp_login)", "description": "Host: {scope, status waiting, auth_url} once the agent CLI printed its sign-in address (https, redirect_uri on localhost or 127.0.0.1 with a port, <=8000 chars), then {scope, status done|failed, error}. Owner (human only): {scope, callback} = the path and query the browser came back to, once, while waiting. auth_url and callback are cleared when the sign-in ends; a request older than 15 minutes no longer moves.", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Updated document"}, "400": {"description": "invalid_request"}, "403": {"description": "callback from a non-human principal"}, "404": {"description": "No such mcp_login request"}, "409": {"description": "Wrong step for the request's state, or expired"}}}
