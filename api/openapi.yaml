        "description": "Human transition:memories and ContentSafe input required. Existing replacement is individually authorized, active/unexpired/approved, revision pinned and source/relation checked. Old record must be active or conflicted. New content inherits old kind; sources require spans. Same scope only; IDs outside scope are indistinguishable from missing (404). Self/mixed inputs invalid. Old status, new memory/revision, navigation references, relation, embedding job and audit commit together. Plain memories transition to superseded is rejected. No automatic backfill. New source-backed records write an internal fence on each active, unexpired source in the same transaction. Concurrent source deletion aborts stale insertion; source semantic revisions are unchanged. Conflict marking also requires live source IDs. This prevents late copies; erasure coverage is determined by the deletion job kind and reported by the source deletion status endpoint.",
