            "name": "kind",
            "in": "query",
            "required": false,
            "description": "Memory kind",
            "schema": {
              "type": "string",
              "enum": [
                "raw",
                "semantic",
                "episodic",
                "procedural",
                "user",
                "decision",
                "lesson"
              ]
            }
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "description": "Inactive status requires include_inactive=true",
            "schema": {
              "type": "string",
              "enum": [
                "active",
                "superseded",
                "conflicted",
                "rejected",
                "expired"
              ]
            }
          },
          {
            "name": "include_inactive",
            "in": "query",
            "required": false,
            "description": "Accepts exactly true or false; include stored history and expired rows",
