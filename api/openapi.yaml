{
  "openapi": "3.1.0",
  "info": {
    "title": "Arkism — 기억·스킬 통합 관리",
    "version": "0.1.0",
    "description": "Supabase PostgreSQL is the canonical source, trace, memory, relationship and permission store. Organization/project access is enforced with FORCE RLS. LangGraph executes agents; LangSmith observes runs and is not canonical. TEI/pgvector indexes ordinary text; existing Gemini/Qdrant design retrieval stays separate. Atlas remains migration-compatible. AI-extracted memories and lessons start as candidates and require explicit verification; facts evolve through supersession. Recovery mode exposes only legacy single-record deletion routes, privacy deletion submit/status/runtime claim/runtime receipt/advance, and session archive expiry. Existing authorization applies; general search, writes, archive reads/use and readiness remain unavailable. Adopted file restores persist a database publication-review marker. While it remains, ordinary API requests except healthz return 503, and normal API/worker/reindex startup is refused; recovery-only deletion and expiry continue. No review-release API is currently provided. Offline administrator write-gate commands can pause canonical, authorization and quota writes at the database trigger layer. Ordinary publication checks refuse a paused, missing or malformed write gate; healthz remains process liveness. Recovery mode has no write-gate bypass. Resuming writes does not release restoration publication review. No HTTP or MCP write-gate mutation endpoint is provided. Offline recovery exports optionally include body-free receipt origins in v5/v6. Global replay requires signed source and restored inventories with reconciled request and receipt origins; older v3/v4 remain readable but do not satisfy this execution gate."
  },
  "x-local-gateway": {
    "windows_connection": "App-owned SSH loopback forwarding to the verified host gateway. Owner-SSH status includes gateway.pid (systemd MainPID); forwarded healthz must match service and PID. Session/role/principal loss or unhealthy process closes the child and hides its URL. No automatic restart or agent settings writes.",
    "host_control": "Separate owner-SSH `arkism gateway-control` manages only the existing arkism-gateway.service (status/start/stop/restart). Mutation requires request_id and expected_revision; durable pre-command receipts prevent same-ID reexecution. Accepted is not execution success; unknown outcomes are not automatically retried. No HTTP administration, installation or agent settings mutation.",
    "server": "http://127.0.0.1:8099",
    "auth": "Every route except GET /healthz requires header x-arkism-gateway-token equal to the host's local token (64 hex, ~/.config/arkism/gateway.token 0600, made on first start; ARKISM_GATEWAY_TOKEN overrides). Missing or wrong: 401 {type:error,error:{type:authentication_error,message:gateway_token_missing|gateway_token_invalid ...}} before any egress. The header is never forwarded. install-arkism adds it to Claude Code ANTHROPIC_CUSTOM_HEADERS when settings.json points ANTHROPIC_BASE_URL at the local gateway. One-release grace: ARKISM_GATEWAY_TOKEN_OPTIONAL=1 lets tokenless calls pass and counts them (healthz tokenless_calls).",
    "routing_report_origin": "Routing call reports from the Messages entrance carry origin {kind:gateway|side, side?:fork|query|compaction|auxiliary|side_reply, session_id?, turn_seq?}. side marks Claude Code side calls (x-claude-code-request-class, else cache_control at messages[n-2] = fork, or no marker + tools=[] + thinking disabled = query). session_id is X-Claude-Code-Session-Id; turn_seq grows per agent turn (new x-claude-code-prompt-id, else a change in the history's user-prompt count) and never moves for side calls or subagents. Routing is unchanged.",
    "host_chat_api_keys": "Explicit codex/grok API mode connects openai/* and xai/* to the first stored matching host API key and its validated base URL. Uses the existing Chat transport and portable Messages/Responses/Gemini conversions. Caller credentials never replace host keys; missing/invalid host configuration cannot switch to a subscription. Direct Messages count_tokens returns501. Existing group rejection/EOF semantics apply.",
    "google_cross_api": "Chat, Messages and stateless Responses. Google direct models/groups use the host Google transport through portable conversion. Text, inline user images, function tools/results and representable options retain meaning. Native response parts and signatures are restored from caller/public-model/context/history-bound in-memory state (1024 turns, 16 MiB native-parts JSON, 900-second idle expiry). Direct Google assistant history and identifiable mggoogle_ tool history return409 on unknown, changed or expired state. Matching group history pins its originating member. Plain-text-only group history with no cache match has no portable origin ID and may route to another provider; strict provenance requires a direct Google model or native Gemini. Conflicting identical public histories cannot overwrite the first native parts/model; the second completion fails (JSON409 or stream error). Imported assistant history, remote image downloads and parallel-disable are unsupported. Direct Google and cache-identified Google group Messages count_tokens return501 without estimation. Empty successful assistant turns remain representable in both JSON and SSE, including thought-only native parts. Tools/completion/state registration wait for validated EOF; only confirmed transport rejection may fail over.",
    "description": "Separate host process; these are not Go management API routes.",
    "paths": {
      "/healthz": {"method": "GET", "response": "{service:arkism-gateway,pid:<process ID>}. Process identity only, not provider readiness. No upstream calls. Queries return400 and POST returns405."},
      "/v1/systemone": {
        "method": "POST",
        "request": "{model:provider/model,state,questions}. Calls the existing authenticated Go decision service with the host runner token. No caller headers, credentials or query strings are forwarded.",
        "response": "Native System One model/answers/actual usage JSON. Preserves choice/score/noul and structured input. Provider refusals keep their status but use fixed errors. No retries, streaming or implicit Chat fallback."
      },
      "/v1/systemone/models": {
        "method": "GET",
        "response": "{object:list,data:[{id,object:model}]} for configured server decision models only. Separate from conversation model lists."
      },
      "/v1/messages": {
        "method": "POST",
        "description": "Host gateway entrance, not a Go route. Explicit anthropic/model and routing-group Claude requests use host API credentials or the subscription CLI; bare Claude models retain legacy caller-auth passthrough. Host API preserves Messages body extensions and validated anthropic-beta only; CLI rejects unsupported beta/options before launch. Caller credentials and query strings never enter the host route. Enabled Anthropic models are included in model discovery. Explicit Anthropic count_tokens uses host API counting; CLI mode returns 501 without generation. Legacy group/custom count estimates remain unchanged. Custom Chat providers use the stdlib Messages-to-Chat bridge. Existing portable compatibility filtering precedes conversion. Tool IDs/arguments and disable_parallel_tool_use are preserved. Text streams immediately; validated tool calls and final usage/stop follow complete upstream EOF. Content-filter refusals are preserved, never replayed as HTTP failures."
      },
      "/v1/responses": {
        "method": "POST",
        "request": "Stateless Responses (explicit store:false), string/message input, user images, function calls/results, instructions, sampling, parallel tools, explicit strict:false function schemas and output limits. Uses existing Chat/Messages execution. Unsupported state/storage/background/reasoning/built-in tools/structured-output semantics fail before generation.",
        "response": "Response JSON or named SSE with sequential sequence_number. Text/refusal deltas arrive before EOF; tools and terminal events require validated EOF and actual usage. Length/content filtering are incomplete, transport/truncation errors never complete or replay. Responses subresource methods are not forwarded upstream.",
        "authentication": "Same host-only provider credentials and existing group/attempt boundaries as the Chat entrance.",
        "limits": {"input_bytes": 8388608, "upstream_response_bytes": 16777216}
      },
      "/v1beta/models": {
        "method": "GET",
        "description": "Gemini model listing and /{model} lookup from the enabled host routing catalogue; provider/model and group IDs are retained. Lists support pageSize/pageToken. No invented token limits or model versions."
      },
      "/v1beta/models/{model}:generateContent": {
        "method": "POST",
        "request": "Gemini text, inline user images, systemInstruction, function declarations/calls/results, single candidate and representable generation options. Known camel/snake aliases accepted without changing user JSON keys. Unsupported semantics rejected before generation.",
        "response": "Gemini candidates/parts JSON, actual usageMetadata and STOP/MAX_TOKENS/SAFETY. Shared Chat/Messages execution, host credentials and group retry boundary. Native google/model targets use the host Google API key or existing Gemini OAuth through Arkism own transport, preserving native parts, thought signatures, tools, safety and generation settings. No embedded Gemini or magpie engine. Signed group history is pinned to its originating member and caller; unknown, expired or different-owner signatures fail without generation."
      },
      "/v1beta/models/{model}:streamGenerateContent": {
        "method": "POST",
        "request": "Same body with explicit alt=sse query.",
        "response": "Gemini data-only SSE; text arrives early, tools/final finishReason/usage only after actual upstream EOF. No duplicated final text or fabricated DONE marker. Errors use Google error shape. Direct google/model countTokens forwards contents-only requests to exact provider counting; unsupported richer counting, group counts and other resources fail locally. Google transport never generates to estimate token counts."
      },
      "/v1beta/models/{model}:countTokens": {
        "method": "POST",
        "request": "Direct google/model and contents-only native Gemini request. Uses the selected host API key or existing Gemini OAuth; no generation or group decision call.",
        "response": "Provider totalTokens and count metadata, including actual zero. Missing/invalid counts fail. Group/custom targets return 501; richer counting requests fail before authentication."
      },
      "/v1/chat/completions": {
        "method": "POST",
        "request": "Chat messages, model (provider/model or group/slug), single choice, text/image/function tools, stream and include_usage. Unsupported options are rejected before execution; omitted Messages limit is 4096 tokens. Codex cannot enforce an explicit output-token limit and rejects that option; without it the backend limit applies.",
        "response": "Chat completion JSON or SSE delta chunks. Uses the existing execution and group failover. Native Chat providers receive the validated original Chat request without double translation; parallel tool indices and settings are preserved. Truncated/error streams never finish with [DONE].",
        "authentication": "Caller credentials are never sent upstream. Host Claude API key, selected Codex account or stored provider key is used. Claude subscriptions use the host-selected CLI and SDK MCP caller tools. Exact owner/model/settings/history matches resume the same process. Tools wait for caller results; expired/mismatched results are rejected without replay. Up to 8 runs, 600-second active deadline, 300-second idle expiry and 16 MiB lifetime stdout. No host built-in tools or hooks. Unsupported sampling/forced tools/parallel-disable options fail before launch. OAuth is not copied into the gateway.",
        "limits": {"input_bytes": 8388608, "upstream_response_bytes": 16777216}
      }
    }
  },
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/v1/work-checkpoints/authorize-handoff": {
      "post": {
        "summary": "Authorize one exact handoff model input",
        "parameters": [],
        "responses": {
          "200": {
            "description": "HandoffTransferOutput",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "authorized",
                    "content_hash",
                    "source_refs",
                    "archive_messages"
                  ],
                  "properties": {
                    "authorized": {
                      "type": "boolean"
                    },
                    "content_hash": {
                      "type": "string"
                    },
                    "source_refs": {
                      "type": "array",
                      "maxItems": 100,
                      "items": {
                        "$ref": "#/components/schemas/Ref"
                      },
                      "description": "Exact canonical recursive evidence references; preserve in every child checkpoint save."
                    },
                    "archive_messages": {
                      "type": "array",
                      "maxItems": 8,
                      "items": {
                        "$ref": "#/components/schemas/ArchiveMessageRef"
                      },
                      "description": "Canonical normalized archive pointers; preserve in every child checkpoint save."
                    }
                  },
                  "additionalProperties": false
                }
              }
            },
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            }
          },
          "400": {
            "description": "Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            }
          },
          "403": {
            "description": "Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            }
          },
          "404": {
            "description": "Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            }
          },
          "409": {
            "description": "Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            }
          },
          "503": {
            "description": "Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "scope",
                  "work",
                  "destination",
                  "content"
                ],
                "properties": {
                  "scope": {
                    "$ref": "#/components/schemas/Scope"
                  },
                  "work": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/Ref"
                      },
                      {
                        "properties": {
                          "collection": {
                            "const": "work_checkpoints"
                          }
                        }
                      }
                    ]
                  },
                  "destination": {
                    "type": "string",
                    "enum": [
                      "external:openai",
                      "external:anthropic"
                    ]
                  },
                  "content": {
                    "type": "string",
                    "maxLength": 100000,
                    "description": "Exact serialized JSON object with task and instructions passed to this single model attempt."
                  },
                  "skills": {
                    "type": "array",
                    "maxItems": 8,
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "skill_id",
                        "version_id",
                        "content_hash"
                      ],
                      "properties": {
                        "skill_id": {
                          "type": "string"
                        },
                        "version_id": {
                          "type": "string"
                        },
                        "content_hash": {
                          "type": "string",
                          "pattern": "^[a-f0-9]{64}$"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "description": "Requires explicit transfer:model_input and external transfer permission. Revalidates canonical parent work, source/archive lineage and latest-approved skills. No reusable export capability or automatic permission grant.",
        "operationId": "authorizeHandoffTransfer"
      }
    },
