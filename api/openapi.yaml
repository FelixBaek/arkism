      "SkillBundle": {
        "type":"object", "additionalProperties":false,
        "description":"Pinned companion files. Sorted unique portable paths, at most 2048 entries. UTF-8 text is stored (at most 200000 UTF-8 bytes per file and 1048576 stored in total). Binary, oversized or over-budget files are pinned by hash only: omitted names why (binary|too_large|limit; the server sets secret for a stored file that trips the secret scan instead of rejecting or redacting it), size is the byte length, no content is stored or served. SHA256 is over each path + LF + file sha256 + LF, in order, for every entry. Hidden/secret paths and secret contents are rejected. Omitted bundle means legacy unpinned companions; empty files explicitly means no companions. Paths are relative to the bundle root: the skill folder, or for a plugin skill the plugin root (its agents/hooks/references/scripts plus this skill's folder).",
        "required":["sha256","files"],
        "properties":{
          "sha256":{"type":"string","pattern":"^[a-f0-9]{64}$"},
          "files":{"type":"array","maxItems":2048,"items":{"oneOf":[
            {"type":"object","additionalProperties":false,"required":["path","sha256","content"],
             "properties":{"path":{"type":"string","minLength":1,"maxLength":512},"sha256":{"type":"string","pattern":"^[a-f0-9]{64}$"},"content":{"type":"string","maxLength":200000}}},
            {"type":"object","additionalProperties":false,"required":["path","sha256","size","omitted"],
             "properties":{"path":{"type":"string","minLength":1,"maxLength":512},"sha256":{"type":"string","pattern":"^[a-f0-9]{64}$"},"size":{"type":"integer","minimum":1},"omitted":{"type":"string","enum":["binary","too_large","limit","secret"]}}}
          ]}}
        }
      },
