        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateInput"
              }
            }
          }
        },
        "description": " Automatic memory_candidates (agent/service/pipeline or generated/generator-bearing human input) require an explicit positive MEMORY_CANDIDATE_DAILY_LIMIT. One deployment-wide UTC daily quota is reserved atomically with candidate/audit. Unconfigured returns503; exhausted returns429 candidate_daily_limit. Human-authored ordinary proposals are excluded. Failed writes do not consume quota. New source-backed records write an internal fence on each active, unexpired source in the same transaction. Concurrent source deletion aborts stale insertion; source semantic revisions are unchanged. Conflict marking also requires live source IDs. This prevents late copies; erasure coverage is determined by the deletion job kind and reported by the source deletion status endpoint. New memory_relations fence each referenced memory/candidate against concurrent deletion in the same transaction; internal writes do not change semantic revision or timestamps. This prevents late relation insertion; memory_relation_erasure handles existing direct member relations after standalone memory deletion. Evaluation records targeting memories/memory_candidates fence that target in the insertion transaction; concurrent deletion aborts stale evaluation insertion, including when the evaluation source remains valid. Successful dependent authorization decisions must match the initial principal and role; mismatch returns 403 without result data. Source replay read checks follow registration commit; earlier receipts/audits and artifact references are retained on response denial. After read authorization, reused sources are compared with the full authorized public record and checked for liveness in a final transaction with a source write fence and body-free audit. Concurrent source deletion or change aborts stale reuse without result data (409 when final validation observes a changed or removed source; database failure or an exhausted retry/deadline may return 503)."
      }
    },
