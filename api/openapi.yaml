              }
            }
          }
        },
        "description": " Skill 검색·라우팅 최종 확인·임베딩 호출 전/최종 저장은 같은 로컬 활성 검사를 사용한다: 같은 scope의 활성·미만료 상위/버전, 일치하는 활성 연결, 유효한 두 출처·버전 직접 관계·독립 평가 근거. Selected local memory/skill/reflection results are reloaded and compared against their pre-truncation public-hit digest in the context-usage transaction. Recheck active/unexpired state, memory approval, source spans and existing skill/reflection evidence validators; fence every local record/source read by these checks. Committed deletion/update before response confirmation fails without items/context_id/context_data or usage/search audit. Policy calls stay outside the transaction; post-commit revocation of delivered bytes is not guaranteed. Semantic revisions are unchanged by internal fences. Evidence/fence retry cost is bounded by the request deadline, not a latency guarantee. For external destinations, repeat existing source-sensitivity/declassification checks inside this transaction without moving external policy calls into it. Successful run-read and per-item context-read/export decisions must retain the principal and role from the initial search decision. A mismatch fails the whole request 403 without items/context_id/context_data or usage/search receipt. Ordinary per-item denials are unchanged. Previously authorized parallel embedding calls/cost records cannot be rolled back, and policy identity is not locked against future changes. Local memories are eligible only at or after effective_at and before expires_at; legacy missing/null start times impose no start bound. Explicit history listing and single-record reads may include future memories. Approved future memories can be embedded in advance, without making them searchable early."
      }
