    "/v1/sources/ingest": {
      "post": {
        "summary": "ingest a bounded text file and source atomically in Mongo",
        "description": "Partial file support: UTF-8 text/plain or application/json, maximum512KiB. Multipart metadata (maximum256KiB) MUST precede file; exactly two parts. Whole request maximum832KiB, one upload per handler, read deadline at most15s. Original bytes undergo local inspection and complete write:sources + write:artifacts policy checks with content_safe=true and matching principal/role. Storage must be configured. File-only sources are allowed. File secrets always block, while source metadata supports existing redaction. PDF/image/audio and larger files remain unsupported; this is not full or byte-backup completion. Recovery mode does not expose this path. Source/artifact creation and replay-read decisions must share the create-stage principal and role; mismatch returns 403 without result data. The early HTTP preflight principal, role and scope are also bound to every subsequent create-stage decision. A mismatch between preflight and create-stage write decisions refuses publication before writing source/artifact/blob records or file bytes. Bounded file reading and inspection still precede the full-content policy decision. Source replay read checks follow registration commit; earlier receipts/audits and artifact references are retained on response denial. After read authorization, reused sources are compared with the full authorized public record and checked for liveness in a final transaction with a source write fence and body-free audit. Concurrent source deletion or change aborts stale reuse without result data (409 when final validation observes a changed or removed source; database failure or an exhausted retry/deadline may return 503).",
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "metadata",
                  "file"
                ],
                "properties": {
                  "metadata": {
                    "$ref": "#/components/schemas/FileIngestInput"
                  },
                  "file": {
                    "type": "string",
                    "format": "binary",
                    "maxLength": 524288
                  }
