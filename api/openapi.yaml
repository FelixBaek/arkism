    "/v1/reflections": {
      "get": {
        "summary": "Group reflection lessons for one task subject",
        "description": "Exact scope, subject and status grouping across every authorized candidate page. candidate_refs identifies all grouped memory_candidates at their current revisions; inclusion does not certify generation eligibility. Partial results are not returned on later-page failure.",
        "parameters": [
          {
            "name": "workspace_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "project_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "user_id",
            "in": "query",
            "required": false,
            "schema": {
