        "description": "Requires read:deletion on the deleted source ID and exact scope. Returns body-free job metadata even after source removal. done means no directly source-linked records remain within the reported coverage: legacy source_memories covers memories/candidates, source_direct_records additionally covers agent_runs/tool_calls/evaluations/reflections. source_records_and_skills additionally covers directly source-linked versions and all versions beneath directly source-linked skill headers, then those headers; active pointers are cleared atomically. source_records_skills_relations additionally erases direct-source relations: ordinary/resolved relations are removed, unresolved conflict payloads are stripped while minimal control records remain for human resolution. redacted_conflicts counts these separately. Other transitive-only references, files/backups/providers are unverified. deleted_records reports cumulative non-memory collection counts; full_erasure_verified remains false. Audit failure returns no result. Existing legacy deletions may have no queued phase and return 404. An unresolved conflict whose two members are both absent is removed outright. redacted_conflicts is a cumulative event count, not the current number awaiting human resolution. New source_records_memory_dependents also queues memory dependent-cleanup jobs atomically with memory deletion. queued_memory_jobs is a registration count: root done means direct cleanup and child registration, not completion of child work. dependent_cleanup reports same-scope child status counts in the same transaction. expected_jobs includes registered memory/candidate and recursively tracked derived-source cleanup jobs, deduplicating shared descendants. queued_source_jobs counts direct derived-source registrations. Cycles, missing links or more than4096 descendants cannot prove completion. tracking_complete requires matching observed count and matching deleted/queued counts for each target type; complete also requires source done and all children done. Missing old parent links are not inferred. Child IDs/bodies are not returned. full_erasure_verified remains false. Candidate-only deletion now queues candidate_evaluation_erasure without requiring a memory. queued_candidate_jobs counts registrations, not completions. Individual memory/candidate deletion status and retry remain available. Legacy source jobs do not gain new child registration. Pending source_memory_dependents_erasure jobs also detach direct artifacts and persist file cleanup intent. pending_artifact_cleanup counts unacknowledged checks; done requires these checks to finish, preserving shared files. Historical done jobs are not reopened. File byte backup and full erasure remain unverified."
