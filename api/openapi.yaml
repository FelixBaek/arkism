    "/v1/sources": {
      "get": {
        "summary": "List active, unexpired source summaries in exact scope (partial)",
        "description": "Newest collected_at then ID first. read:sources authorizes each row including lookahead; any denial fails the page. Final source fences and body-free audit must commit. Cursor is filter-bound, not a snapshot or permission; limit may change. Period is [collected_from,collected_to) in UTC milliseconds. Unknown or repeated query keys fail. No total or derived-memory count is supplied yet; remain incomplete. Not available in recovery. Cursor is an unsigned position, never authorization. Within an allowed scope, varying date filters or positions and observing 200/403 can reveal the existence/time interval of denied rows; existence non-disclosure is not guaranteed. No denied row fields or next_cursor are returned on failure. Optional q searches full stored source.text by literal case-sensitive substring, while returning the same first-line summaries. Final transaction rechecks matching body. No embedding, file-body search, query snapshot or large-volume latency guarantee. For q search only, skip individually denied rows and scan subsequent matching batches until limit+1 authorized rows or exhaustion; all-denied matches return the same empty200 as no matches. Cursor exposes only the last returned ID. Scope-level denial, policy outage and allowed principal/role changes still fail. Per-row policy cost may exceed102 calls, bounded by request deadline; timing/failure side channels are not concealed. Existing no-q listing still fails on any denied row. Query retention by policy servers/proxies is outside101 logging guarantees. Per-row ErrDenied includes missing-principal/wrong-scope decisions under the existing authorizer classification and these rows are omitted; initial scope validation and provider communication errors still fail. Direct-DB invalid IDs are unsupported and may fail internal cursor validation.",
