                "$ref": "#/components/schemas/ChangeInput"
              }
            }
          }
        },
        "description": "Actual generic deletion rejects privacy_quarantined records with 409 inside the mutation transaction; paired memory/proposal deletion checks both records and rolls back together. Only dry_run=true or dry_run=false is accepted as a query parameter; duplicate, unknown, empty or malformed options fail 400 before deletion. Omitted/false preserves actual deletion. True only supports memories/sources and never calls Delete. Same human principal needs delete/read target and read of every referencing row (including read:jobs and read:artifacts). Exact four-field scope and target revision are checked in one transaction snapshot. Historical/expired references are counted regardless of referenced revision, once per document, excluding self, audit_events and global blobs. Exact-scope artifacts are counted, but file bytes and automatic artifact erasure remain outside this phase. No bodies/IDs of dependents are returned. More than 1000 references or policy/audit/database failure returns no partial preview. Counts describe direct structured references, not planned erasures. Transitive descendants/files/caches/backups/providers are not claimed to be covered. Snapshot is informational, not an execution reservation. Actual source deletion atomically enqueues source_records_memory_dependents cleanup and returns 202. It erases direct-source memories, candidates, agent runs, tool calls, evaluations, reflections and skill versions. A directly source-linked skill header is removed only after all its same-scope versions, even versions citing other sources; those other source documents remain. Removing an active version clears its parent pointer atomically without choosing another version. Direct-source memory relations are removed; unresolved conflicts instead retain an allowlisted content_erased control record with no source refs or original payload, counted separately in redacted_conflicts. Their surviving members are not automatically transitioned. Memory deletion returns 202 after atomically registering a memory_evaluation_erasure job. Other actual deletions still return 200. full_erasure_verified is always false: other derived collections, transitive memory propagation, files/backups/providers remain outside this phase. Actual memory deletion also removes its server-linked proposal in the same transaction, requiring delete:memory_candidates from the same human principal. A valid proposal must reference memory_candidates with the same ID and positive revision. Missing candidates are tolerated; malformed links fail 503, revisions older than the proposal fail 409. With no proposal, no candidate is inferred. Both deletion audits commit together; source documents and unrelated memories are preserved. Preview counts incoming references only, not this outgoing proposal link. Other dependent erasure remains incomplete. Preview success does not authorize proposal deletion: actual deletion may still fail 403. Nonpositive expected_revision is 400. Duplicate/concurrent deletion can return 404 after a completed delete or 409 for a changed revision. Malformed proposal recovery requires verified operational repair; no correction API is provided. Legacy memory_relation_erasure cleanup scans same-scope relations referencing the memory or its proven proposal in batches of100. Normal/resolved relations are deleted; unresolved conflicts retain body-free control records only while another member exists. Surviving members are not transitioned. A private job cursor prevents retained controls from being processed repeatedly. Status/retry are available at /v1/memories/{id}/deletion and /retry; retry preserves progress. Existing source job scopes are unchanged. All writers must include member-deletion fencing before deployment. Memory insertion rejects reuse of an ID with a memory deletion job (memory_relation_erasure or memory_evaluation_erasure, 409); malformed deletion evidence fails503. This also blocks reapproval of unlinked legacy candidates from resurrecting deleted memories, without deleting those candidates. New memory_evaluation_erasure jobs first delete evaluations whose target is the deleted memory or proven proposal, regardless of target revision, status, expiry or independent sources, then perform the same direct relation cleanup. Requires service erase:memory_records on the root and erase:evaluations/erase:memory_relations per row. New coverage is memory_relations_evaluations; retry preserves legacy memory_relations coverage. Evaluation insertion fences memory/candidate targets against concurrent deletion. Reflection or other records referring transitively to erased evaluations are outside this phase. New source_memory_dependents_erasure retains direct-source cleanup and atomically queues memory_evaluation_erasure for each deleted memory. It propagates to independently sourced target evaluations/relations through the existing child worker. A valid linked proposal is included only if already absent. Existing candidates are preserved. Requires service erase:source_memory_dependents at source root. Older source kinds retain their original coverage. Candidate deletion atomically registers candidate_evaluation_erasure and returns202/candidate_relations_evaluations. Same-scope target-candidate evaluations and candidate-member relations are erased in batches; same-ID memories are never inferred. Status/retry is available at /v1/memory_candidates/{id}/deletion and /retry. Candidate insertion refuses a tombstoned ID. New source_memory_dependents_erasure also queues candidate cleanup with queued_candidate_jobs. For dry_run previews, target and reference read decisions must match the initial delete decision in both principal and role; mismatch returns 403 without preview data."
      }
    },
