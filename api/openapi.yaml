    "/v1/session-archives/search": {
      "post": {
        "operationId": "sessionArchiveSearch",
        "summary": "search",
        "description": "Read safe user/assistant text from live encrypted originals with read:session_archives. Line positions, current archive version and optional stable message identity are revalidated; historical content is data_only_untrusted. Never renews retention. Search scans at most 16MiB of records and 20 archives per page; Zcode role lookups add their scan cost to scanned_bytes without a total metadata prefix cap. Requests have a 15-second deadline or the caller's shorter deadline; follow next_cursor even for empty pages. Large JSONL/AgentsView/Zcode records and Antigravity SQLite BLOBs are streamed and may exceed the page scan budget; invalid, secret and unsupported records are reported. SQLite retains its shorter 10-second query deadline. Message reads return at most 64KiB with next_text_offset.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ArchiveSearchInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Safe historical data only",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ArchiveSearchOutput"
                }
              }
            }
          },
          "400": {
            "description": "Invalid payload or digest"
          },
          "403": {
