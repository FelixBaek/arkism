  "x-privacy-deletion-contract": {
    "derived_erasure_hold": "Canonical record batches recheck overlapping holds in-transaction; held batches return their lease and wait one minute without consuming failure attempts or advancing progress. File GC checks held pending-artifact jobs when committing its pending marker; hold rejects overlapping markers before unlink. Archive expiry remains a separate boundary.",
    "canonical_kind": "privacy_deletion",
    "target_types": ["source_event", "trace", "subject", "work_checkpoint"],
    "states": ["requested", "authorized", "discovering_impact", "quarantined", "purging_runtime", "purging_derived", "waiting_for_retention_or_backup", "held", "verifying", "completed", "partial", "failed", "cancelled"],
    "request_required": ["scope", "idempotency_key", "target_type", "target_ids", "reason", "retention_policy_ref"],
    "runtime_action_required": ["deletion_request_id", "revision", "lease_token", "request_hash", "scope", "source_event_ids", "trace_ids", "hold_status", "expected_run_ids"],
    "runtime_receipt_required": ["request_hash", "quarantined", "verified", "expected_run_ids", "matched_run_ids", "absent_run_ids", "affected_run_ids", "counts", "held", "errors"],
    "completion": "Server-computed only after runtime receipt, root and child erasure completion, artifact cleanup, zero structural source references, native payload erasure, and no pending backup retention.",
    "notes": "Exact four-part scope; bounded structural discovery; no raw body in jobs, audit, action or receipt. Production backup and external observability erasure are not implemented."
  },
  "x-storage-contracts": {
    "artifacts": {
      "collections": [
        "blobs",
        "artifacts"
      ],
      "notes": "Public /v1/sources/ingest supports the bounded UTF-8 text/JSON subset documented in file_ingestion_support. Complete file bytes and sanitized source metadata require local inspection plus write:sources and write:artifacts content_safe decisions before publication. Source, artifact, blob reference count, dedup pointer, idempotency receipt and audits commit together in Mongo; filesystem publication is separately fenced, not atomic with Mongo. Root/database bidirectional binding and write/fsync probes run at startup/readiness and file operations under the shared flock. A pre-created private local root is exclusive to one database; UID/GID65532 shared API/worker mounts are configured by optional compose.files.yaml. Source deletion batches atomically detach references and persist file-cleanup intent, then authorized leased batches collect only zero-reference files. Legacy completed deletion jobs are not reopened. Wrong bindings, ambiguous commits and reference inconsistencies fail closed; absent storage preserves text-only readiness and refuses file ingestion. UUID-preserving clones and live database/root replacement are unsupported. Readiness does not verify full file inventory/digests. Scoped artifact downloads recheck current source, policy, references and physical digest before audited delivery. Offline file-byte backup/restore is available through an explicit stopped-writer bundle and quarantined adoption. Large/binary ingestion, operational backup certification and full erasure remain unverified.",
      "file_ingestion_available": true,
      "file_ingestion_support": {
        "path": "/v1/sources/ingest",
        "mime": [
          "text/plain",
          "application/json"
        ],
        "max_file_bytes": 524288,
        "full_fr_002_complete": false
      },
      "file_read_available": true,
      "file_read_support": {
        "path": "/v1/sources/{id}/artifacts/{artifact_id}",
        "max_file_bytes": 209715200,
        "full_fr_002_complete": false
      },
      "orphan_collection": {
        "command": "memoryd --collect-blobs",
        "scope": {
          "workspace_id": "__memory_blobs__",
          "project_id": "__memory_blobs__",
          "user_id": "",
          "agent_id": ""
        },
        "action": "maintain:blobs",
        "resource_id": "storage",
        "role": "service",
        "timeout_seconds": 300,
        "notes": "Explicit operator maintenance, no HTTP route or automatic schedule. Rechecks authorization and commits a body-free intent audit before each cleanup. Shared flock and bidirectional database/root binding; preserves actual artifact references; confirmed pending fence precedes unlink. Streams 64 directory entries at a time and pages 64 zero-reference blob IDs, including markers left after unlink. Only strict private upload/binding temporary files are removed. Unknown names, links, permissions, inconsistent counts and ambiguous commits fail closed. Partial progress is not rolled back. Counts emitted only on success; not full erasure or file backup verification."
      },
      "offline_backup_restore": {
        "create": "arkism backup-bundle create --writers-stopped --database-archive FILE --blob-root DIRECTORY",
        "extract": "arkism backup-bundle extract --input AUTHENTICATED_ZIP --output NEW_DIRECTORY",
        "adopt": "memoryd --adopt-restored-blobs",
        "role": "service",
        "action": "restore:blobs",
        "scope": {
          "workspace_id": "__memory_blobs__",
          "project_id": "__memory_blobs__",
          "user_id": "",
          "agent_id": ""
        },
        "resource_id": "storage",
        "format_version": 1,
        "max_files": 100000,
        "max_file_bytes": 209715200,
        "max_manifest_bytes": 8388608,
        "notes": "Operator must stop all writers throughout dump, bundle, restore and deletion replay. The flag does not prove quiescence. Encrypt/authenticate with `arkism backup-archive` before off-host storage or extraction. Quarantine blocks blob readiness until all files, restored reference counts, source binding and new DB/root binding are verified. Never adopts into the original identity or overwrites another registered root. Metadata reads stream in batches; no automatic deployment, retention choice, off-host destination, online snapshot or full erasure claim."
      }
    }
  }
