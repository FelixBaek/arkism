      "post": {
        "summary": "Queue a CLI update (human write:providers only)",
        "description": "Body {scope,provider,cli,request_id,expected_version,expected_via}. Only anthropic/claude and openai/codex are accepted. A reported account must have matching cli and cli_info.version/via with update=true. Within the retained request history, an existing request_id with the same input returns the existing request before inspecting current installation data, without new work or audit; different input returns 409. Another pending request for the same CLI or a queue full of pending work returns 409. New requests use request_id as ID, kind=cli_update and status=pending, with a human audit in the same transaction. No command, path or credential is accepted; unknown fields are rejected. Pending CLI updates expire after 20 minutes. Memoryd never executes an update.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["scope", "provider", "cli", "request_id", "expected_version", "expected_via"], "properties": {"scope": {"$ref": "#/components/schemas/Scope"}, "provider": {"type": "string", "enum": ["anthropic", "openai"]}, "cli": {"type": "string", "enum": ["claude", "codex"]}, "request_id": {"type": "string", "pattern": "^[0-9a-f]{32}$"}, "expected_version": {"type": "string", "minLength": 1, "maxLength": 60, "pattern": "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$"}, "expected_via": {"type": "string", "enum": ["npm", "brew", "self"]}}}}}},
        "responses": {"200": {"description": "Updated providers record or existing request"}, "400": {"description": "invalid_request"}, "403": {"description": "access_denied: requires human write:providers"}, "409": {"description": "revision_conflict: changed installation, unavailable update, reused ID with different input, pending CLI update or full queue"}, "422": {"description": "secret_detected"}}
      }
    },
