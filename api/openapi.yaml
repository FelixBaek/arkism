        "description": "The server redeems the code with Google using its client secret and returns MEMORY_DESKTOP_TOKEN only for a verified e-mail in MEMORY_GOOGLE_ALLOWED_EMAILS. The token belongs to a separate human principal, never the owner token.",
        "security": [],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "properties": {"code": {"type": "string", "maxLength": 2048}, "code_verifier": {"type": "string", "minLength": 43, "maxLength": 128}, "redirect_uri": {"type": "string", "description": "http://127.0.0.1:<port>/... or http://localhost:<port>/... only"}}, "required": ["code", "code_verifier", "redirect_uri"]}}}},
        "responses": {
