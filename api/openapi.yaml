                    "type": "string",
                    "pattern": "^[A-Za-z0-9_.-]{1,128}$"
                  },
                  "expected_revision": {
                    "type": "integer",
                    "minimum": 0
                  },
                  "archive_messages": {"type": "array", "maxItems": 8, "items": {"$ref": "#/components/schemas/ArchiveMessageRef"}, "description": "Append verified provenance; exact current archive SHA required for new saves. Historical refs are retained."},
                  "package": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "title",
                      "goal",
                      "repository",
                      "origin"
                    ],
                    "properties": {
                      "title": {
                        "type": "string"
                      },
                      "goal": {
                        "type": "string"
                      },
                      "repository": {
                        "type": "string"
                      },
                      "branch": {
                        "type": "string"
                      },
                      "head": {
                        "type": "string"
                      },
                      "origin": {
                        "type": "string"
                      },
                      "session_id": {
                        "type": "string"
                      },
                      "status": {
                        "type": "string",
                        "enum": [
                          "in_progress",
                          "blocked",
                          "completed"
                        ],
                        "default": "in_progress"
                      },
                      "decisions": {
                        "type": "array",
                        "maxItems": 100,
                        "items": {
                          "type": "string"
                        }
                      },
                      "completed": {
                        "type": "array",
                        "maxItems": 100,
                        "items": {
                          "type": "string"
                        }
                      },
                      "next_steps": {
                        "type": "array",
                        "maxItems": 100,
                        "items": {
                          "type": "string"
                        }
                      },
                      "constraints": {
                        "type": "array",
                        "maxItems": 100,
                        "items": {
                          "type": "string"
                        }
                      },
                      "files": {
                        "type": "array",
                        "maxItems": 100,
                        "items": {
                          "type": "object",
                          "additionalProperties": false,
                          "required": [
                            "path",
                            "sha256"
                          ],
                          "properties": {
                            "path": {
                              "type": "string"
                            },
                            "sha256": {
                              "type": "string",
                              "pattern": "^[a-f0-9]{64}$"
                            }
                          }
                        }
                      },
                      "checks": {
                        "type": "array",
                        "maxItems": 100,
                        "items": {
                          "type": "object",
                          "additionalProperties": false,
                          "required": [
                            "command",
                            "outcome"
                          ],
                          "properties": {
                            "command": {
                              "type": "string"
                            },
                            "summary": {
                              "type": "string"
                            },
                            "outcome": {
                              "type": "string",
                              "enum": [
                                "passed",
                                "failed",
                                "not_run"
                              ]
                            }
                          }
                        }
                      },
                      "source_refs": {
                        "type": "array",
                        "maxItems": 100,
                        "items": {
                          "type": "object",
                          "additionalProperties": false,
                          "required": [
                            "collection",
                            "id",
                            "revision"
                          ],
                          "properties": {
                            "collection": {
                              "type": "string"
                            },
                            "id": {
                              "type": "string"
                            },
                            "revision": {
                              "type": "integer",
                              "minimum": 1
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Operation completed",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "revision": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "authority": {
                      "const": "data_only_untrusted"
                    }
                  },
                  "required": [
                    "id",
                    "revision",
                    "authority"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Invalid package"
