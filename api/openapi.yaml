    "/v1/agent_tools": {
      "get": {"summary": "The scope's agent MCP servers and plugins as last reported by the host sync tool, plus pending switches", "parameters": [{"name": "workspace_id", "in": "query", "required": true, "schema": {"type": "string"}}, {"name": "project_id", "in": "query", "required": true, "schema": {"type": "string"}}, {"name": "user_id", "in": "query", "schema": {"type": "string"}}], "responses": {"200": {"description": "Document (empty before the first report)"}}},
      "post": {"summary": "Host sync tool reports the inventory it saw and the outcome of switches it applied", "description": "Names, transport and program or host only; a payload that looks like it carries a credential is refused (422 secret_detected). Optional skill_checks (per agent skill folder: name, path, quality_score 0-100 and quality_grade A-F from NVIDIA SkillEvaluator, risk_score 0-100 and verdict SAFE|CAUTION|DO_NOT_INSTALL from NVIDIA SkillSpector, finding count and up to three category · pattern · severity labels) and skill_check_tools replace the stored scan; leaving skill_checks out keeps it.", "responses": {"200": {"description": "Updated document"}, "400": {"description": "Unknown agent, transport or state"}, "422": {"description": "secret_detected"}}}
    },
    "/v1/agent_tools/requests": {
