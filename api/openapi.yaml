    "/v1/memories/conflicts": {
      "post": {
        "summary": "Mark or resolve memory/candidate conflicts",
        "description": "Requires human transition:<collection> and ContentSafe=true on each ID, same principal. Allowed collections are memories and memory_candidates, including mixed pairs. Same exact scope; absent/out-of-scope IDs return 404. Mark fences both members with a single conflict_id; active unheld member remains searchable. Resolve checks relation/member revisions and original order; retained members require current valid sources/relations; memories additionally require approval. Selected missing members cannot be activated; missing rejected members are recorded in relation.conflict.missing. Whole mutation/job/audit is atomic. Pending conflict prevents generic transition/supersede; memory deletion stays allowed, but deleting the pending conflict relation returns409 until resolved. Retained candidates return to candidate and require separate explicit approval; no memory copy or candidate embedding job is created. Supersession resolutions require two existing memories; the selected winner becomes active and the other superseded. Shared history links, supersedes relation, conflict resolution, jobs and audit commit atomically. Candidates are rejected for these modes, and missing endpoints return409. Automatic conflict detection and UI are not implemented. New source-backed records write an internal fence on each active, unexpired source in the same transaction. Concurrent source deletion aborts stale insertion; source semantic revisions are unchanged. Conflict marking also requires live source IDs. This prevents late copies; erasure coverage is determined by the deletion job kind and reported by the source deletion status endpoint. Mark checks both members' sources before mutation: missing, inactive, expired or invalid source spans return 403 under the existing provenance policy. Deletion racing after this check may return 409. Expired sources do not trigger automatic cleanup; explicit authorized deletion remains available. A content_erased unresolved conflict is read as allowlisted control metadata. Resolving it keeps the same human permissions and member checks, then deletes the retained control record atomically with member updates and audit. The new resolution reason is returned but is not persisted in that erased control record.",
