    "/v1/routing/groups": {
      "get": {"summary": "Arkism routing groups (read:routing)", "description": "Scoped {items,revision,auto_discover,authority}. Group {id:group/<slug>,name,enabled,strategy:smart|ordered,members:[provider/model],discovered?:true}. Explicit groups precede discovered groups; discovery matches exact model IDs across providers.", "responses": {"200": {"description": "Groups"}}},
      "post": {"summary": "Replace routing groups (human write:routing)", "description": "Required {scope,expected_revision,groups,auto_discover}. Atomic replacement at routing revision. At most 64 groups and 1..40 distinct enabled model members per group; no nested groups. Name 1..100 characters; group slug 1..64 lowercase letters/digits/hyphens. Discovered rows must be converted to explicit groups before saving.", "responses": {"200": {"description": "Groups"}, "400": {"description": "invalid_request"}, "403": {"description": "access_denied"}, "404": {"description": "Unknown or disabled member"}, "409": {"description": "revision_conflict"}}}
    },
    "/v1/routing/decide": {
      "post": {"summary": "Pick a model for a task (route:models)", "description": "Body {scope, task, exclude?, providers?, group?}. A group constrains both choice and fallbacks to its enabled members, preserving provider/exclude/quota checks. Unknown group is 404; disabled or exhausted group is 503. Ordered strategy uses member order; smart uses the existing classifier when enabled, falling back to member order. Global default and fallback order do not override group order. The response echoes group when requested. providers keeps only those providers' models. Before selection and fallbacks, a subscription model is excluded only when the provider has connected default=true accounts and all of those accounts have usage_status=ok, usage_checked_at within the last 2 minutes (up to 5 seconds of future clock skew), and an applicable window with left_pct=0 whose reset is future or unknown. Model-specific windows match the model name or prefix at a separator boundary, including claude-prefixed aliases; unrelated model windows do not block it. quotas takes precedence over the legacy quota alias. Unknown or stale usage, or no connected default accounts, does not prove exhaustion. Non-default API-mode accounts and kind=api providers are not gated by subscription quotas. Credits do not automatically refill a zero window. This only filters decide candidates and never changes UI enabled settings. Clef-flash picks among the remaining routing models when auto routing is on; else the fixed or first remaining model. Returns {id, model, provider, family, decision, classifier_ms, fallbacks, authority}.", "responses": {"200": {"description": "Decision"}, "503": {"description": "No eligible model remains"}}}
    },
    "/v1/routing/systemone": {
      "get": {"summary": "Configured decision models (route:models)", "description": "Scope query. Returns {items:[{id,name}],authority}. Only configured JevJudge instances already used by ModelPicker/Router are listed; no credentials or inferred model availability.", "responses": {"200": {"description": "Configured models"}, "403": {"description": "access_denied"}}},
      "post": {"summary": "Evaluate System One questions through the existing decision engine (route:models and write:routing_calls)", "description": "Body {scope,request:{model:provider/model,state,questions}}. Exact scope, complete-content external transfer authorization, configured model selection, input/output bounds and response validation. Reuses existing host credentials and metadata-only provider/routing call records. Request 8 MiB plus 1 KiB management wrapper; provider response 16 MiB; call 8 seconds. Existing safeTransfer additionally limits serialized outbound content to 64000 bytes, without truncation. No automatic retry. Returns {status,result,authority}; provider non-200 carries its original status and a fixed error, never its body. Unknown fields, images/stream extensions and unsupported semantics fail before transfer.", "responses": {"200": {"description": "Decision result or fixed upstream HTTP refusal envelope"}, "400": {"description": "invalid_request"}, "403": {"description": "access_denied"}, "503": {"description": "dependency_unavailable"}}}
    },
