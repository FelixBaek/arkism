    "/v1/model-budget/status": {
      "post": {
        "summary": "Read configured shared account allowance",
        "description": "One deployment-owned exact scope and UTC month/day. Limits are <= $100 total and <= $90 general per month. Configured service identities only for mutations, current authorization and explicit priority grant required. Missing/expired policy denies. Human readers need read:model_budget. Amounts are integer pico-USD (1 USD = 1e12). Committed amounts include outstanding worst-case reservations; not all are actual spend. No prompt or key is stored. Uncertain dispatch cannot be released as not_sent. Cache creation counters are disjoint 5-minute and 1-hour counts.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "scope"
                ],
                "properties": {
                  "scope": {
                    "$ref": "#/components/schemas/Scope"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Current budget result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModelBudgetStatus"
                }
              }
            }
          },
          "400": {
            "description": "Invalid model/role/token bound or settlement"
          },
          "403": {
            "description": "Missing, expired or unauthorized policy"
          },
          "409": {
            "description": "Operation or settlement conflicts"
          },
          "429": {
            "description": "model_budget_exceeded"
          },
          "503": {
            "description": "Durable reservation unavailable; do not dispatch"
          }
        }
      }
    },
    "/v1/model-budget/subscription-usage": {
      "post": {
        "summary": "Record one subscription CLI call's usage (record only, ST-620 / FR-012)",
        "description": "settle:model_budget by a service principal listed in ModelBudgetPolicy; same exact policy scope, policy not expired. Never reserves, settles or refuses for spend: the call already ran on the user's Claude subscription. Idempotent per scope+principal+operation_id; a changed replay is 409. Files a provider_usage row (provider claude_cli) at list price and adds to the month's subscription counter shown by status. No prompt, output or credential is accepted.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["scope", "operation_id", "operation", "usage"], "properties": {
          "scope": {"$ref": "#/components/schemas/Scope"},
          "operation_id": {"type": "string", "pattern": "^[a-zA-Z0-9_.-]{1,128}$"},
          "operation": {"type": "string", "pattern": "^[a-zA-Z0-9_.-]{1,64}$", "description": "Harness role or worker label, e.g. session_processor, capture."},
          "usage": {"type": "object", "additionalProperties": false, "required": ["model", "input_tokens", "output_tokens"], "properties": {"model": {"type": "string", "maxLength": 128}, "requests": {"type": "integer", "minimum": 0, "maximum": 20}, "input_tokens": {"type": "integer", "minimum": 0, "maximum": 100000000}, "output_tokens": {"type": "integer", "minimum": 0, "maximum": 100000000}}, "description": "input_tokens + output_tokens must be > 0; model must not look like a secret; requests 0 is counted as 1."}
        }}}}},
        "responses": {
          "200": {"description": "{id, recorded, estimated_cost_pico_usd, pricing_available}"},
          "400": {"description": "invalid_request: invalid operation_id/operation/usage, empty usage or unknown field"},
          "403": {"description": "access_denied: missing, expired or unauthorized policy, or principal not in ModelBudgetPolicy"},
          "409": {"description": "revision_conflict: same scope, principal and operation_id with different input"},
          "503": {"description": "dependency_unavailable: store or the month's subscription counter unavailable; the record may or may not have committed, so retry the identical request under the same scope and principal, with the same operation_id and unchanged input"}
        }
      }
    },
