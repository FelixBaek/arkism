          "400": {"description": "Malformed input or a non-loopback redirect", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
          "403": {"description": "Google refused the code, or the account is not allowed or not verified", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
          "404": {"description": "Google sign-in is not configured", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
