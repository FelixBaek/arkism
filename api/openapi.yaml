              "type": "boolean",
              "default": false
            }
          },
          {
            "name": "updated_since",
            "in": "query",
            "required": false,
            "description": "RFC 3339 time; only rows updated after it. With include_inactive=true a refresh also sees rows that left the active list.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "Opaque unsigned cursor bound to scope and filters",
            "schema": {
              "type": "string",
              "maxLength": 2048
            }
          }
        ],
