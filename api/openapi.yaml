      "post": {"summary": "Add a workflow, template or persona (human principals only)", "description": "Body {scope, crew}. Agent and team only: pinned[] (<=20) {collection memories|skills|knowledge_sources, id, revision (0/omitted = latest approved; skills: version number), injection full|summary|reference, priority 0-100}; every new or changed pin must name an approved record of the same scope (400 otherwise); pins read first by GET /v1/context/pins and context build with agent. crew.type workflow|template|persona; name; role; category; avatar{art,bg}. Workflow: handle (required, unique among live workflows; compared without $, spaces and case), model (default worker model, optional), trigger{kind schedule|webhook, cron, label} (optional) and enabled, limits{max_steps 1..500, max_minutes 1..1440} (optional), cover{id, url, thumb, author, author_url} (an Unsplash photo: url and thumb on https://images.unsplash.com/, author_url on https://unsplash.com/), graph (required, at least one node); no template fields. graph{nodes[{id,type,title,x,y,config (string values)}], edges[{from,port,to,max 0..10}]}: edges with max 0 must form a DAG; an edge with max > 0 goes back (from != to) and is followed at most max times per run. Node types start|schedule|webhook|ai|ai_once|code|http|github|approval|condition|merge|loop|wait|notify|end|n8n|subflow. Template: instructions, model (optional), effort low|medium|high|max, run_mode fixed|caller, skills, tools, agents claude_code|codex|gemini|zcode, skill_rules [{field category|name, value}], skills_off, file_name, install claude_code|codex|zcode, memory {user|procedural|decision|lesson: all|category|expert|off}, scripts [{name, desc, lang bash|sh|python|go, code}], template, a required category, no handle. Persona: name, role (where it is used), instructions; no handle. Credentials are refused.", "responses": {"200": {"description": "Created record"}, "400": {"description": "invalid_request"}, "403": {"description": "Not a human principal"}, "409": {"description": "Handle already used"}, "422": {"description": "secret_detected"}}}
