    "/v1/maintenance_proposals": {"get": {"summary": "Memory cleanup proposals of one status (default open), newest first, up to 500 (read:maintenance_proposals)", "parameters": [{"name": "workspace_id", "in": "query", "required": true, "schema": {"type": "string"}}, {"name": "project_id", "in": "query", "required": true, "schema": {"type": "string"}}, {"name": "user_id", "in": "query", "schema": {"type": "string"}}, {"name": "status", "in": "query", "schema": {"type": "string", "enum": ["open", "accepted", "swapped", "dismissed", "stale"]}}], "responses": {"200": {"description": "items (records with a maintenance field: type duplicate|contradiction, keep and retire refs {collection memories, id, revision}, reason same_meaning|more_specific|newer_replaces_older, decision, decided_by, decided_at; or a signal proposal (ST-814): type rule_often_violated|lesson_often_failing, memory ref, reason low_pass_rate, evidence {samples, passed, pass_rate}). No memory text."}}}, "post": {"summary": "Propose keeping one of two active memories (write:maintenance_proposals)", "description": "Body {scope, proposal{type, keep, retire, reason}}. Both memories must be live, approved, outside any conflict and at the given revisions (409 otherwise). One record per pair (id from the scope and both ids): a decided pair, or an open one at the same revisions, comes back with duplicate=true; an open one at older revisions or a stale one is replaced in place. Reason is a fixed code; free text is refused. Signal proposal (ST-814): proposal{type rule_often_violated (memory kind user|procedural|decision) or lesson_often_failing (lesson), memory ref, reason low_pass_rate, evidence{samples, passed}}, keep and retire empty; samples and passed must equal the stored memory signal (409 otherwise), pass_rate is recomputed, and the token also needs read:usage. One record per memory.", "responses": {"200": {"description": "The proposal record"}, "400": {"description": "invalid_request"}, "409": {"description": "revision_conflict"}}}},
    "/v1/maintenance_proposals/{id}/decide": {"post": {"summary": "A person's answer to a proposal (human principals only)", "description": "Body {scope, expected_revision, decision accept|swap|dismiss}. accept keeps keep and supersedes retire, swap the other way round, dismiss changes nothing. A signal proposal takes accept or dismiss only (swap 400) and neither changes the memory. accept and swap run the conflict path's mark and resolve (second_supersedes_first) with the proposal close in one transaction and need transition:memories on both memories. A memory changed since the proposal returns 409 and marks the proposal stale.", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "The closed proposal"}, "400": {"description": "invalid_request"}, "403": {"description": "Not a human principal"}, "409": {"description": "revision_conflict"}}}},
    "/v1/context/pins": {"get": {"summary": "Resolved pins of a work agent or team (read:crew, context:read)", "description": "agent=@handle of a live agent or team in the scope. Pins come in priority order, each read now: status ok|not_found|not_approved|revision_mismatch|secret_blocked|denied; only ok pins carry item (a data-only hit shaped by injection full|summary|reference). Optional destination external:<name> runs the transfer policy as search does.", "parameters": [{"name": "workspace_id", "in": "query", "required": true, "schema": {"type": "string"}}, {"name": "project_id", "in": "query", "required": true, "schema": {"type": "string"}}, {"name": "user_id", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "agent_id", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "agent", "in": "query", "required": true, "schema": {"type": "string"}}, {"name": "destination", "in": "query", "required": false, "schema": {"type": "string"}}], "responses": {"200": {"description": "{crew, handle, type, items[{pin, status, item?}], authority, notice}"}, "404": {"description": "not_found"}}}, "post": {"summary": "Resolve pins a host is injecting and record them (context:read)", "description": "Body {scope, agent, destination?}. Same answer as GET plus context_id: the injected pinned memories are stored in a context_usage receipt (purpose session_start), like the memories a search hands out. GET writes no receipt.", "responses": {"200": {"description": "{context_id?, crew, handle, type, items[{pin, status, item?}], authority, notice}"}, "404": {"description": "not_found"}}}},
    "/v1/merge_proposals": {"get": {"summary": "Memory merge proposals of one status (default open), newest first, up to 500 (read:merge_proposals)", "parameters": [{"name": "workspace_id", "in": "query", "required": true, "schema": {"type": "string"}}, {"name": "project_id", "in": "query", "required": true, "schema": {"type": "string"}}, {"name": "user_id", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "agent_id", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "status", "in": "query", "schema": {"type": "string", "enum": ["open", "accepted", "dismissed", "stale"]}}], "responses": {"200": {"description": "items: records with merge.proposal {candidate, action store|merge|skip, targets, reason_code, reason (short model note, data only, cleared on close), pool_id, decision, decided_by, decided_at, memory}"}}}, "post": {"summary": "Submit a judge's verdicts for a pool (write:merge_proposals)", "description": "Body {scope, pool_id, pool_revision, generator, verdicts[{candidate_id, action, target_ids, reason_code, reason}]}. The pool is single use, made by the same principal and unexpired (409 otherwise). Each verdict is checked alone: a candidate or target outside the pool, an unknown action or reason, a secret in the note, or a record changed since the pool was made is refused (per-item status 400/409) and stored nowhere. Nothing changes until a person decides.", "responses": {"200": {"description": "{items[{index, status, code?, record?}], proposed, rejected}"}, "400": {"description": "invalid_request"}, "409": {"description": "revision_conflict"}}}},
    "/v1/merge_proposals/pool": {"post": {"summary": "Build a pool of undecided memory candidates and their most similar approved memories (human principals only)", "description": "Body {scope, limit 1-20 (10), k 1-5 (3)}. Candidates with a proposal for their current revision are left out. The stored pool holds references only; the answer carries the texts for the judge, data only.", "responses": {"200": {"description": "{id, revision, expires_at, candidates[{ref, kind, text, similar}], memories[{ref, kind, text}], degraded, authority, notice}; no id when there is nothing to ask"}, "403": {"description": "Not a human principal"}}}},
