            "description": "UTF-8 literal case-sensitive substring of full memory text, at most256 bytes before trimming. Explicit empty, controls, secrets and duplicates rejected. Included in cursor binding and passed to initial read:memories policy; query is not stored in101 audit/logs. No file-body/OCR search.",
