name: Coverage

# Codecov = coverage only. It reports but never blocks a merge (codecov.yml makes every status
# informational and an upload failure does not fail this job). Do not make it a required check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && fromJSON('["self-hosted","arkism-self"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    # Postgres store tests skip without POSTGRES_TEST_DSN; give them a disposable pgvector DB.
    services:
      postgres:
        # pg17. The self-hosted runner has no docker: an empty image skips the service there
        # and tools/ci_postgres.sh starts a local cluster instead.
        image: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && '' || 'pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d' }}
        env:
          POSTGRES_USER: arkism
          # Throwaway DB on a loopback-only port of a disposable runner.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: arkism_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U arkism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Postgres for tests
        env:
          SERVICE_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: tools/ci_postgres.sh
      - name: Go coverage
        run: go test -covermode=atomic -coverprofile=go-coverage.out ./...
      - name: UI coverage
        run: >
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=ui-lcov.info
          desktop/ui/*.test.js
      - name: Upload Go coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: go-coverage.out
          flags: go
          fail_ci_if_error: false
      - name: Upload UI coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui-lcov.info
          flags: ui
          fail_ci_if_error: false
