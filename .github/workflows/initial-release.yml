name: Initial public release

# Retained for an explicit manual bootstrap/retry only. Editing this file must
# never automatically publish a release. The selected main commit must pass both gates.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: initial-public-release-v0.1.0
  cancel-in-progress: false

jobs:
  quality:
    if: github.repository == 'FelixBaek/arkism'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the main branch for initial publication
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Wait for correctness and external Sonar quality on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 tools/check_release_quality.py --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA"

  packages:
    needs: quality
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      version: "0.1.0"
      publish_initial: true
    secrets: inherit
