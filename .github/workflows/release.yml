name: Release

# A tag vX.Y.Z builds and checks the Windows installer and the Linux server bundles
# (the app's 서버 업데이트 installs the bundle with its own version over SSH), then puts
# them and the update file (latest.json) in a draft release. Publishing the draft is a person's
# step. Manual and pull request builds produce artifacts without a release.
# Pull requests validate workflow metadata only; no installer is built automatically.
#
# Windows Authenticode signing is optional:
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
# Minisign publisher authentication is mandatory for public releases.
# The release-signing environment holds ARKISM_UPDATE_SIGNING_KEY (minisign
# secret-key file contents) and optional ARKISM_UPDATE_SIGNING_PASSWORD.
# vars.ARKISM_UPDATE_PUBLIC_KEY is base64 of the full public-key file; it is
# compiled into the Windows app independently of the update feed.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish_initial:
        default: false
        type: boolean
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/check_release_quality.py"
      - "tools/test_check_release_quality.py"
      - "tools/release_artifacts.py"
      - "tools/test_release_artifacts.py"
      - "internal/buildinfo/**"
      - "tools/install-minisign.sh"
      - "desktop/installer/**"
      - "desktop/src-tauri/**"
      - "internal/memory/migrations/**"
      - "internal/memory/schema_migrations*.go"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (x.y.z)"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || (github.event_name == 'push' && github.ref_name) || '0.1.0' }}
  # The app checks this address for latest.json and downloads the installer from it.
  ARKISM_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download
  ARKISM_UPDATE_PUBLIC_KEY: ${{ vars.ARKISM_UPDATE_PUBLIC_KEY }}
  ARKISM_UPDATE_CHANNEL: stable

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate build version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected version x.y.z'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || inputs.publish_initial
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact-commit quality before packaging
        if: github.event_name == 'push' || inputs.publish_initial
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 tools/release_artifacts.py check-key
          python3 tools/check_release_quality.py --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA"

  windows:
    # Product packaging requires an explicit tag/manual/call event, never PR CI.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Rust and NSIS
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          choco install nsis -y --no-progress
      - name: Silent installer launch options (inert payload)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force desktop/dist | Out-Null
          $evidence = Join-Path $env:RUNNER_TEMP 'arkism-nsis-autorun-check.json'
          ./desktop/installer/test-nsis-autorun.ps1 -Makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -SourceSha $env:GITHUB_SHA -EvidencePath $evidence
      - name: Installer helper dispatch and recovery controls (inert peer)
        shell: powershell
        run: ./desktop/installer/test-installer-helper.ps1 -Makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - name: Autostart cleanup failure controls (inert peer)
        shell: powershell
        run: ./desktop/installer/test-remove-autostart.ps1 -Makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - name: Default uninstaller process tree (inert fixture)
        shell: powershell
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'arkism-nsis-process-job-check.json'
          ./desktop/installer/test-nsis-uninstall-job.ps1 -Makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -SourceSha $env:GITHUB_SHA -EvidencePath $evidence
      - name: Build installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          ./desktop/installer/build-windows.ps1 -Version $version -Makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -InstalledSmoke
      - name: Fresh product removal and retained files (disposable Windows)
        shell: powershell
        run: |
          $version = $env:VERSION.TrimStart('v')
          $installer = Join-Path $env:GITHUB_WORKSPACE "desktop/dist/Arkism-$version-setup.exe"
          $stage = Join-Path $env:GITHUB_WORKSPACE 'desktop/stage'
          $evidence = Join-Path $env:RUNNER_TEMP 'arkism-windows-product-uninstall-check.json'
          ./desktop/installer/smoke-windows-product-uninstall.ps1 -InstallerPath $installer -StagePath $stage -Version $version -SourceSha $env:GITHUB_SHA -EvidencePath $evidence -DatabasePreservation
      - name: Existing synthetic profile upgrade from published 0.1.4 (disposable Windows)
        shell: powershell
        run: |
          $version = $env:VERSION.TrimStart('v')
          $evidence = Join-Path $env:RUNNER_TEMP 'arkism-windows-upgrade-check.json'
          if ([Version]$version -le [Version]'0.1.4') {
            @{ status = 'not_applicable'; cross_version_upgrade_tested = $false; baseline_version = '0.1.4'; candidate_version = $version; source_sha = $env:GITHUB_SHA } | ConvertTo-Json | Set-Content -LiteralPath $evidence -Encoding UTF8
            Write-Host 'Published-baseline upgrade is not applicable to versions at or below 0.1.4.'
            exit 0
          }
          $baseline = Join-Path $env:RUNNER_TEMP 'arkism-upgrade-baseline'
          if (Test-Path -LiteralPath $baseline) { throw 'upgrade baseline directory already exists' }
          New-Item -ItemType Directory -Path $baseline | Out-Null
          $oldInstaller = Join-Path $baseline 'Arkism-0.1.4-setup.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/FelixBaek/arkism/releases/download/v0.1.4/Arkism-0.1.4-setup.exe' -OutFile $oldInstaller
          $installer = Join-Path $env:GITHUB_WORKSPACE "desktop/dist/Arkism-$version-setup.exe"
          $stage = Join-Path $env:GITHUB_WORKSPACE 'desktop/stage'
          ./desktop/installer/smoke-windows-upgrade.ps1 -BaselineInstallerPath $oldInstaller -InstallerPath $installer -StagePath $stage -Version $version -SourceSha $env:GITHUB_SHA -EvidencePath $evidence
      - name: Syft SBOM of the Windows payload and dependency locks
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          $zip = Join-Path $env:RUNNER_TEMP 'syft.zip'
          Invoke-WebRequest -Uri 'https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_windows_amd64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -cne 'ada4c9b93af575f479ce80fce6629897272a2d41f300a14bc49bace020767ca2') { throw 'Syft archive hash mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'syft'
          Expand-Archive -LiteralPath $zip -DestinationPath $tools
          $inputDir = Join-Path $env:RUNNER_TEMP 'sbom-input'
          New-Item -ItemType Directory $inputDir | Out-Null
          Copy-Item -Recurse desktop/stage (Join-Path $inputDir 'payload')
          Copy-Item go.mod, go.sum, desktop/src-tauri/Cargo.lock $inputDir
          & (Join-Path $tools 'syft.exe') scan "dir:$inputDir" --source-name arkism-windows --source-version $version -o "spdx-json=desktop/dist/Arkism-$version-windows.sbom.spdx.json"
          if ($LASTEXITCODE -ne 0) { throw 'Syft SBOM generation failed' }
      - name: Attest the Windows installer and SBOM
        id: provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          create-storage-record: false
          subject-path: |
            desktop/dist/Arkism-*-setup.exe
            desktop/dist/Arkism-*-windows.sbom.spdx.json
      - name: Keep the public provenance bundle with release inputs
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:BUNDLE -Destination desktop/dist/provenance.intoto.jsonl
      - name: Collect installer check evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'arkism-nsis-autorun-check.json'
          if (Test-Path -LiteralPath $evidence -PathType Leaf) {
            New-Item -ItemType Directory -Force desktop/dist | Out-Null
            Copy-Item -LiteralPath $evidence -Destination desktop/dist/nsis-autorun-check.json
          }
          $jobEvidence = Join-Path $env:RUNNER_TEMP 'arkism-nsis-process-job-check.json'
          if (Test-Path -LiteralPath $jobEvidence -PathType Leaf) {
            New-Item -ItemType Directory -Force desktop/dist | Out-Null
            Copy-Item -LiteralPath $jobEvidence -Destination desktop/dist/nsis-process-job-check.json
          }
          $productEvidence = Join-Path $env:RUNNER_TEMP 'arkism-windows-product-uninstall-check.json'
          if (Test-Path -LiteralPath $productEvidence -PathType Leaf) {
            New-Item -ItemType Directory -Force desktop/dist | Out-Null
            Copy-Item -LiteralPath $productEvidence -Destination desktop/dist/windows-product-uninstall-check.json
          }
          $upgradeEvidence = Join-Path $env:RUNNER_TEMP 'arkism-windows-upgrade-check.json'
          if (Test-Path -LiteralPath $upgradeEvidence -PathType Leaf) {
            New-Item -ItemType Directory -Force desktop/dist | Out-Null
            Copy-Item -LiteralPath $upgradeEvidence -Destination desktop/dist/windows-upgrade-check.json
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-installed-check
          path: |
            desktop/dist/windows-staged-runtime-check.json
            desktop/dist/windows-installed-check.json
            desktop/dist/nsis-autorun-check.json
            desktop/dist/nsis-process-job-check.json
            desktop/dist/windows-product-uninstall-check.json
            desktop/dist/windows-upgrade-check.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            desktop/dist/Arkism-*-setup.exe*
            desktop/dist/Arkism-*-windows.sbom.spdx.json
            desktop/dist/provenance.intoto.jsonl
          if-no-files-found: error

  server:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the Linux server bundles
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          epoch="$(git log -1 --format=%ct)"
          mkdir -p dist
          for arch in amd64 arm64; do
            out="$RUNNER_TEMP/server-$arch"
            mkdir -p "$out"
            for cmd in arkism arkism-crew memoryd memory-principal; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
                -ldflags "-X github.com/FelixBaek/arkism/internal/buildinfo.Version=$version" \
                -o "$out/$cmd" "./cmd/$cmd"
            done
            # Same bytes for the same commit: fixed order, owner and time, no gzip timestamp.
            tar -C "$out" --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$epoch" \
              -cf - arkism arkism-crew memoryd memory-principal | gzip -n9 > "dist/arkism-server-$version-linux-$arch.tar.gz"
          done
          [ "$("$RUNNER_TEMP/server-amd64/arkism" version)" = "$version" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: dist/arkism-server-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_initial &&
       inputs.version == '0.1.0' && github.ref == 'refs/heads/main' &&
       github.repository == 'FelixBaek/arkism')
    needs: [windows, server]
    environment: release-signing
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0 # release notes read the commits since the previous tag
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: server
      - name: Install pinned minisign verification tool
        run: |
          bash tools/install-minisign.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - name: Verify build provenance before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in "dist/Arkism-${VERSION#v}-setup.exe" "dist/Arkism-${VERSION#v}-windows.sbom.spdx.json"; do
            gh attestation verify "$file" --bundle dist/provenance.intoto.jsonl \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Sign and verify release assets
        env:
          ARKISM_UPDATE_SIGNING_KEY: ${{ secrets.ARKISM_UPDATE_SIGNING_KEY }}
          ARKISM_UPDATE_SIGNING_PASSWORD: ${{ secrets.ARKISM_UPDATE_SIGNING_PASSWORD }}
        run: >-
          python3 tools/release_artifacts.py sign --directory dist
          --version "${VERSION#v}" --feed "$ARKISM_UPDATE_FEED"
      - name: Independent final signature and checksum gate
        run: >-
          python3 tools/release_artifacts.py verify --directory dist
          --version "${VERSION#v}" --feed "$ARKISM_UPDATE_FEED"
      - name: Recheck exact-commit quality before release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 tools/check_release_quality.py --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --timeout-seconds 0
      - name: Draft tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"  # none on the first tag: notes cover its whole history
          python3 tools/release_notes.py --range "${prev:+$prev..}$GITHUB_REF_NAME" --title "Arkism ${VERSION#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Arkism ${VERSION#v}" --notes-file "$RUNNER_TEMP/notes.md" dist/*
      - name: Publish the verified initial release
        if: inputs.publish_initial && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v0.1.0"
          # Never move an existing tag or publish binaries built from another commit.
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag")"
          existing="$(jq -c --arg ref "refs/tags/$tag" '.[] | select(.ref == $ref)' <<< "$refs")"
          if [ -n "$existing" ]; then
            jq -e --arg sha "$RELEASE_SHA" '.object.type == "commit" and .object.sha == $sha' <<< "$existing" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$RELEASE_SHA"
          fi
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | {tag_name, draft}')"
          existing_release="$(jq -sc --arg tag "$tag" 'map(select(.tag_name == $tag)) | first // empty' <<< "$releases")"
          if [ -n "$existing_release" ]; then
            # A published release is immutable here; retries must not replace public assets.
            if [ "$(jq -r .draft <<< "$existing_release")" != "true" ]; then
              echo "Release already published for the verified commit."
              exit 0
            fi
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --draft --verify-tag \
              --title "Arkism 0.1.0" --notes-file guide/releases/v0.1.0.md dist/*
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
