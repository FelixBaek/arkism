name: Release

# A tag vX.Y.Z builds the Windows installer, the macOS app (Apple silicon) and the Linux AppImage
# and .deb, checks that each starts its built-in Arkism, and puts them in a draft release with the
# update file (latest.json) the app reads. Publishing the draft is a person's step. Running the
# workflow by hand builds the same files as workflow artifacts without a release.
#
# Signing is optional and happens only when the secrets are set:
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            and for notarization APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Without them Windows SmartScreen and macOS Gatekeeper warn on first open (README explains).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (x.y.z)"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  # The app checks this address for latest.json and downloads the installer from it.
  ARKISM_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Rust and NSIS
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          choco install nsis -y --no-progress
      - name: Build installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          ./desktop/installer/build-windows.ps1 -Version $version -Makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: desktop/dist/Arkism-*-setup.exe*
          if-no-files-found: error

  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple silicon
            name: macos
          - os: ubuntu-22.04 # the oldest glibc the AppImage still runs on
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential file bison flex zlib1g-dev
      - name: macOS signing (only when the secrets are set)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri signs (and notarizes) when these are present; an empty one would make it try and fail.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              { echo "$name<<ARKISM_EOF"; echo "$value"; echo "ARKISM_EOF"; } >> "$GITHUB_ENV"
            fi
          done
      - name: Build app
        run: ./desktop/build-unix.sh --version "${VERSION#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            desktop/dist/*.dmg*
            desktop/dist/*.app.zip*
            desktop/dist/*.AppImage*
            desktop/dist/*.deb*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [windows, unix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Update file
        run: |
          version="${VERSION#v}"
          file="Arkism-$version-setup.exe"
          test -f "dist/$file"
          sum="$(sha256sum "dist/$file" | cut -d' ' -f1)"
          printf '{"version":"%s","file":"%s","sha256":"%s"}\n' "$version" "$file" "$sum" > dist/latest.json
          ls -l dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Arkism ${VERSION#v}" --generate-notes dist/*
