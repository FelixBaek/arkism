name: Release

# A tag vX.Y.Z builds the Windows installer, the macOS app (Apple silicon) and the Linux AppImage
# and .deb, checks that each starts its built-in Arkism, and puts them in a draft release with the
# update file (latest.json) the app reads. Publishing the draft is a person's step. Running the
# workflow by hand, or changing packaging in a pull request, builds workflow artifacts without
# a release. Pull request artifacts use version 0.1.0 and are disposable validation builds.
#
# Signing is optional and happens only when the secrets are set:
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            and for notarization APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Without them Windows SmartScreen and macOS Gatekeeper warn on first open (README explains).

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish_initial:
        default: false
        type: boolean
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/check_release_quality.py"
      - "tools/test_check_release_quality.py"
      - "desktop/build-unix.sh"
      - "desktop/installer/**"
      - "desktop/src-tauri/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (x.y.z)"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || (github.event_name == 'push' && github.ref_name) || '0.1.0' }}
  # The app checks this address for latest.json and downloads the installer from it.
  ARKISM_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate build version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected version x.y.z'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || inputs.publish_initial
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact-commit quality before packaging
        if: github.event_name == 'push' || inputs.publish_initial
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 tools/check_release_quality.py --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA"

  windows:
    permissions:
      contents: read
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Rust and NSIS
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          choco install nsis -y --no-progress
      - name: Build installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          ./desktop/installer/build-windows.ps1 -Version $version -Makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: desktop/dist/Arkism-*-setup.exe*
          if-no-files-found: error

  unix:
    permissions:
      contents: read
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple silicon
            name: macos
          - os: ubuntu-22.04 # the oldest glibc the AppImage still runs on
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential file bison flex zlib1g-dev
      - name: macOS signing (only when the secrets are set)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri signs (and notarizes) when these are present; an empty one would make it try and fail.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              { echo "$name<<ARKISM_EOF"; echo "$value"; echo "ARKISM_EOF"; } >> "$GITHUB_ENV"
            fi
          done
      - name: Build app
        run: ./desktop/build-unix.sh --version "${VERSION#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            desktop/dist/*.dmg*
            desktop/dist/*.app.zip*
            desktop/dist/*.AppImage*
            desktop/dist/*.deb*
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_initial &&
       inputs.version == '0.1.0' && github.ref == 'refs/heads/main' &&
       github.repository == 'FelixBaek/arkism')
    needs: [windows, unix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Update file
        run: |
          version="${VERSION#v}"
          file="Arkism-$version-setup.exe"
          test -f "dist/$file"
          sum="$(sha256sum "dist/$file" | cut -d' ' -f1)"
          printf '{"version":"%s","file":"%s","sha256":"%s"}\n' "$version" "$file" "$sum" > dist/latest.json
          ls -l dist
      - name: Recheck exact-commit quality before release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 tools/check_release_quality.py --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --timeout-seconds 0
      - name: Draft tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Arkism ${VERSION#v}" --generate-notes dist/*
      - name: Publish the verified initial release
        if: inputs.publish_initial && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v0.1.0"
          # Never move an existing tag or publish binaries built from another commit.
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag")"
          existing="$(jq -c --arg ref "refs/tags/$tag" '.[] | select(.ref == $ref)' <<< "$refs")"
          if [ -n "$existing" ]; then
            jq -e --arg sha "$RELEASE_SHA" '.object.type == "commit" and .object.sha == $sha' <<< "$existing" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$RELEASE_SHA"
          fi
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | {tag_name, draft}')"
          existing_release="$(jq -sc --arg tag "$tag" 'map(select(.tag_name == $tag)) | first // empty' <<< "$releases")"
          if [ -n "$existing_release" ]; then
            # A published release is immutable here; retries must not replace public assets.
            if [ "$(jq -r .draft <<< "$existing_release")" != "true" ]; then
              echo "Release already published for the verified commit."
              exit 0
            fi
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --draft --verify-tag \
              --title "Arkism 0.1.0" --notes-file guide/releases/v0.1.0.md dist/*
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
