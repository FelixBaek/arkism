name: Lint JS

# ESLint over the desktop UI scripts and test tools, then tsc over the UI files that opt in with // @ts-check.
# Both run from desktop/frontend's pinned devDependencies; nothing here touches the shipped bundle.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-js-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-js:
    runs-on: ${{ vars.ARKISM_USE_HOSTED_RUNNERS != 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","arkism-self"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned frontend tools
        run: npm ci --prefix desktop/frontend --ignore-scripts --no-audit --no-fund
      - name: ESLint
        run: npm run lint --prefix desktop/frontend
      - name: Type check (tsc --noEmit)
        run: npm run typecheck --prefix desktop/frontend
