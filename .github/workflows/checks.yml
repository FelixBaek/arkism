name: Checks

# Merge gate for correctness: Go server, desktop UI and the Tauri shell run as parallel jobs.
# Core boundary coverage is enforced here; Codecov reports broader coverage (coverage.yml).
# Code quality is SonarCloud's job (sonarcloud.yml) and
# security is CodeQL default setup on the GitHub side.
# Linux jobs from this repository's own branches run on the owner's self-hosted runner (label arkism-self);
# fork and Dependabot PRs stay on GitHub-hosted ubuntu-24.04 so outside code never runs on that machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # Supersede outdated PR runs; finish every main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","arkism-self"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep local-only files out of the public repository
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -E '(^|/)(\.gitignore|\.dockerignore|\.env|\.env\..*)$' || true)
          if [ -n "$found" ]; then
            echo "::error::These files must stay local and never be committed:"
            echo "$found"
            exit 1
          fi
      - name: gitleaks (pinned release, checksum checked; fake test values are listed in .gitleaks.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

  go:
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","arkism-self"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Self-hosted runners keep the Go build and module caches in their own HOME.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Postgres for tests
        run: tools/ci_postgres.sh
      - name: Vet (Linux, Windows, macOS) and unit + Postgres integration tests (race)
        # Vet runs alongside the tests; the two slow packages run as parallel test groups (tools/ci_go_test.py).
        run: |
          { go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...; } > "$RUNNER_TEMP/vet.log" 2>&1 &
          vet=$!
          status=0
          python3 tools/ci_go_test.py --race --integration || status=$?
          if ! wait "$vet"; then cat "$RUNNER_TEMP/vet.log"; echo "::error::go vet failed"; exit 1; fi
          cat "$RUNNER_TEMP/vet.log"
          exit "$status"
      - name: Core boundary coverage (90% per file)
        if: ${{ !cancelled() }}
        run: |
          go test -coverprofile=core-coverage.out -run 'TestTEI|TestCandidate|TestContext|TestSearchBudget' ./internal/memory
          python3 tools/check_core_coverage.py core-coverage.out
      - name: Release scripts parse
        run: bash -n desktop/build-unix.sh desktop/installer/prepare-runtime.sh

  evaluation:
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","arkism-self"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline evaluation and measurement regression tests
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 -m unittest discover -s evaluation -p 'test_*.py'
          python3 -m unittest discover -s evaluation/reuse-v010/benchmark -p 'test_*.py'

  go-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Self-hosted runners keep the Go build and module caches in their own HOME.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Build Go commands on Windows
        run: go build ./cmd/...
      - name: Literal user evidence for memory capture on Windows
        run: go test -v -count=1 -run '^TestCaptureClaimEvidence' ./internal/host/capture
      - name: Captured memory context and retry receipts on Windows
        run: go test -v -count=1 -run '^TestCapture(OptionalContext|ContextReceipt)' ./internal/host/capture
      - name: Execute Windows skill bundle capture
        run: go test -v -count=1 -run '^TestWindowsBundleCaptureMatchesTheUnixRules$' ./internal/host/skills
      - name: Windows installer task payload
        run: go test -v -count=1 -run '^TestWindowsInstallerIncludesTaskScripts$' ./internal/host/capture
      - name: Capture privacy boundaries on Windows
        run: >-
          go test -v -count=1
          -run 'TestPrivate|TestArchive(Private|UploadRespects|PolicyRechecked|NativeTransportRetry|ProjectionRetry|InspectionFailure|SourceMutation|StagingCleanup|PrettyJSON|SQLiteRecorded|DatabaseSource|DryRunInspects|BoundedWriter)|TestCapture(InvalidSettings|Exclusions|SkippedByPause)|TestHookDoesNothingInAnExcludedFolder'
          ./internal/host/capture
      - name: Cached memory currentness and restart recovery on Windows
        run: >-
          go test -v -count=1
          -run '^Test(Stable|Prompt|IndexPoints|CaptureUtility|CaptureStats|SessionStartPins|SkillListNever|SkillSectionNever|ConcurrentFirstSessionStarts|PinAgentAndFitDigest|LegacyStableCache|CachedDelivery|NewStableCache)'
          ./internal/host/capture
      - name: Windows path spelling and reparse protection
        run: go test -v -count=1 -run '^TestWindowsResolved|^TestResolved' ./internal/host/capture
      - name: Windows atomic receipt publication
        run: go test -v -count=1 -run '^TestEnqueueReceipt|^TestWindowsReceiptPublication' ./internal/crewrun
      - name: Windows scheduled task registration contract
        shell: powershell
        run: ./tools/test_windows_scheduled_tasks.ps1
      - name: Windows runtime download integrity
        shell: powershell
        run: ./desktop/installer/test-prepare-runtime.ps1
      - name: Installed runtime smoke boundaries (offline)
        shell: powershell
        run: ./desktop/installer/test-smoke-windows-installed.ps1
      - name: Process tree completion boundaries (offline)
        shell: powershell
        run: ./desktop/installer/test-windows-process-job.ps1
      - name: Product removal boundaries (offline)
        shell: powershell
        run: ./desktop/installer/test-windows-product-uninstall.ps1
      - name: Verify cross-platform migration checksums
        run: go test -v -count=1 -run '^TestSchemaMigrationChecksumAcrossPlatforms$' ./internal/memory

  ui:
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","arkism-self"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The UI is plain JavaScript with no package.json, so there is nothing to install.
      - name: UI tests
        run: node --test desktop/ui/*.test.js

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","arkism-self"]') || matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        id: rust
        with:
          toolchain: stable
      - name: Linux WebView packages
        # The self-hosted runner has these preinstalled and no sudo.
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust build directory
        # Self-hosted runners wipe the workspace after each job but keep their HOME, so the build stays warm there.
        shell: bash
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_DIR=$HOME/.cache/arkism-tauri-target" >> "$GITHUB_ENV"
          fi
      - name: Restore Rust build cache
        if: runner.environment == 'github-hosted'
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            target
            !target/**/incremental/**
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ matrix.os }}-${{ runner.arch }}-tauri-v1-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/Cargo.toml') }}
          restore-keys: ${{ matrix.os }}-${{ runner.arch }}-tauri-v1-${{ steps.rust.outputs.cachekey }}-
      - name: Tauri shell tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Go for Windows runtime control checks
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Windows runtime process and control checks
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'invalid runtime check source' }
          $checkedSource = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkedSource -cne $env:GITHUB_SHA) { throw 'runtime check source mismatch' }
          $checkRoot = Join-Path $env:RUNNER_TEMP ('arkism-runtime-control-' + [guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $checkRoot -ErrorAction Stop
          $peer = Join-Path $checkRoot 'runtime-control-peer.exe'
          $evidence = Join-Path $checkRoot 'runtime-control-check.json'
          "ARKISM_WINDOWS_RUNTIME_CONTROL_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          go build -trimpath -ldflags "-X main.sourceSHA=$env:GITHUB_SHA" -o $peer ./desktop/src-tauri/tests/windows_runtime_control_peer
          if ($LASTEXITCODE -ne 0) { throw 'runtime control peer build failed' }
          $env:ARKISM_WINDOWS_RUNTIME_CONTROL_NATIVE = '1'
          $env:ARKISM_WINDOWS_RUNTIME_CONTROL_SOURCE_SHA = $env:GITHUB_SHA
          $env:ARKISM_WINDOWS_RUNTIME_CONTROL_PEER_EXE = $peer
          $env:ARKISM_WINDOWS_RUNTIME_CONTROL_PEER_SHA256 = (Get-FileHash -LiteralPath $peer -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:ARKISM_WINDOWS_RUNTIME_CONTROL_EVIDENCE = $evidence
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --test windows_runtime_control hosted_windows_runtime_control -- --ignored --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'native Windows runtime control checks failed' }
          if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) { throw 'runtime control evidence missing' }
      - name: Upload Windows runtime control evidence
        if: always() && runner.os == 'Windows' && runner.environment == 'github-hosted' && env.ARKISM_WINDOWS_RUNTIME_CONTROL_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-control-check
          path: ${{ env.ARKISM_WINDOWS_RUNTIME_CONTROL_EVIDENCE }}
          if-no-files-found: error
          retention-days: 3
      - name: NSIS for Windows installer identity checks
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Windows installer file identity checks
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: ./desktop/installer/test-update-installer-identity.ps1 -Makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - name: Upload Windows installer file identity evidence
        if: always() && runner.os == 'Windows' && runner.environment == 'github-hosted' && env.ARKISM_UPDATE_IDENTITY_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-update-installer-identity-check
          path: ${{ env.ARKISM_UPDATE_IDENTITY_EVIDENCE }}
          if-no-files-found: error
          retention-days: 3
      - name: Save Rust build cache
        if: ${{ !cancelled() && runner.environment == 'github-hosted' && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            target
            !target/**/incremental/**
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
