name: Checks

# Merge gate for correctness: Go server, desktop UI and the Tauri shell run as parallel jobs.
# Code quality is SonarCloud's job (sonarcloud.yml), coverage is Codecov's (coverage.yml) and
# security is CodeQL default setup on the GitHub side.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # Supersede outdated PR runs; finish every main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gitleaks (pinned release, checksum checked; fake test values are listed in .gitleaks.toml)
        run: |
          curl -sfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Vet for Windows and macOS
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Release scripts parse
        run: bash -n desktop/build-unix.sh desktop/installer/prepare-runtime.sh

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The UI is plain JavaScript with no package.json, so there is nothing to install.
      - name: UI tests
        run: node --test desktop/ui/*.test.js

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        id: rust
        with:
          toolchain: stable
      - name: Linux WebView packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            target
            !target/**/incremental/**
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ matrix.os }}-${{ runner.arch }}-tauri-v1-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/Cargo.toml') }}
          restore-keys: ${{ matrix.os }}-${{ runner.arch }}-tauri-v1-${{ steps.rust.outputs.cachekey }}-
      - name: Tauri shell tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Save Rust build cache
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            target
            !target/**/incremental/**
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
