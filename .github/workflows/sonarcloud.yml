name: SonarCloud

# Quality gate. CI-based analysis so sonar-project.properties (exclusions and reviewed ignores)
# applies; automatic analysis must stay OFF in the SonarCloud project settings.
# Coverage is Codecov's job, so it is excluded from the SonarCloud quality gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # Fork pull requests get no SONAR_TOKEN.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # New code is measured from the last version change, so tag analyses with the app version.
      - name: Read app version
        id: version
        run: |
          version=$(jq -er '.version | select(type == "string" and length > 0)' desktop/src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=felixbaek
            -Dsonar.projectKey=FelixBaek_arkism
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.coverage.exclusions=**/*

      - name: Diagnose duplicated source blocks
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          def get(endpoint, **params):
              url = "https://sonarcloud.io/api/" + endpoint + "?" + urllib.parse.urlencode(params)
              token = base64.b64encode((os.environ["SONAR_TOKEN"] + ":").encode()).decode()
              req = urllib.request.Request(url, headers={"Authorization": "Basic " + token})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          report = get("measures/component_tree", component="FelixBaek_arkism", pullRequest=41, metricKeys="new_duplicated_lines,new_lines,new_duplicated_lines_density", qualifiers="FIL", ps=500)
          print(json.dumps(report, indent=2))
          for item in report.get("components", []):
              duplicated = next((m for m in item.get("measures", []) if m["metric"] == "new_duplicated_lines"), {})
              values = [duplicated.get("value", "0"), duplicated.get("period", {}).get("value", "0")]
              values += [p.get("value", "0") for p in duplicated.get("periods", [])]
              if any(float(v) > 0 for v in values):
                  print("DUPLICATED FILE", item["key"])
                  print(json.dumps(get("duplications/show", key=item["key"], pullRequest=41), indent=2))
          PY
