# Dependabot = security alerts and security-fix PRs only. Security scanning is CodeQL (GitHub default setup).
# open-pull-requests-limit: 0 turns off routine version-bump PRs; security updates ignore this limit.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go-minor:
        applies-to: security-updates
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      cargo-minor:
        applies-to: security-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /desktop/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-minor:
        applies-to: security-updates
        update-types: [minor, patch]
