# SonarCloud settings. CI: .github/workflows/sonarcloud.yml (CI-based analysis; automatic analysis stays OFF
# so these exclusions and reviewed ignores apply). sonar.projectVersion comes from desktop/src-tauri/tauri.conf.json.
sonar.organization=felixbaek
sonar.projectKey=FelixBaek_arkism
sonar.projectName=Arkism
sonar.sources=.
sonar.exclusions=**/target/**,**/dist/**,**/*.lock,go.sum,desktop/src-tauri/icons/**,desktop/src-tauri/gen/**,desktop/ui/fonts/**,desktop/ui/img/**,**/testdata/**,**/*_test.go,**/*.test.js,tools/test_*.py
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.js,tools/test_*.py,desktop/installer/test-prepare-runtime.ps1,desktop/installer/test-smoke-windows-installed.ps1,desktop/installer/test-nsis-autorun.ps1,desktop/installer/test-windows-process-job.ps1,desktop/installer/test-nsis-uninstall-job.ps1,desktop/installer/test-windows-product-uninstall.ps1
# SQL assets here target PostgreSQL/PLpgSQL and run in real PostgreSQL tests.
# Sonar assigns .sql to its Oracle PL/SQL analyzer by default; reserve that
# analyzer for Oracle suffixes instead of applying Oracle-only rules to PostgreSQL.
sonar.plsql.file.suffixes=.plsql,.pks,.pkb,.pls
# Coverage is Codecov's job (coverage.yml), so it is kept out of the SonarCloud quality gate.
sonar.coverage.exclusions=**/*
# The English UI dictionary is translation data; similar Korean→English pairs are not copied code.
sonar.cpd.exclusions=desktop/ui/i18n-en.js

# Intentional exceptions. Each one names the rule, the files and the reason.
sonar.issue.ignore.multicriteria=gocx,golit,goargs,rscx,jscx,jscx2,pycx1,pycx2,pycx3,jsternary,jscatch,jsoneline,jstpl,jsnest,jsinner,jsempty,jsneg,jschain,jsassign,jsmodern,gopath1,gopath2,gopath3,gopath4,gopath5,gopath6,gopath7,gopath8,gopath9,gohttp1,gohttp2,gohttp3,gohttp4,gohttp5,goperm1,goperm2,goperm3,devcli1,devcli2,devcli3,devcli4,devcli5,devcli6,devcli7,devcli8,evrnd,uiverifyseq,goiface1,goiface2,goiface3,goiface4,goiface5,goiface6,goiface7,goiface8,goiface9,goiface10,goiface11,goctx1,goctx2,goctx3,goctx4,goctx5,jsawait1,jsawait2,jsawait3,jsawait4,jsawait5,jsawait6,jsawait7,jsawait8,jsawait9,jsawait10,jsawait11,goiface12,cs1,cs2,cs3,cs4,cs5,cs6,cs7,cs8,cs9,cs10,cs11,cs12,cs13,cssimp

# Cognitive complexity: protocol, recovery and port code keeps each check sequence in one function
# so it reads top to bottom against its tests; splitting it would scatter the order that matters.
# CI's config/go-complexity-baseline.json is a separate cyclomatic check (limit 20), not a stand-in for S3776.
# shortcut: existing Go, Rust and JavaScript debt is hidden here; remove these entries as their cleanup PRs land.
# gocx (#234): every Go line dates after the new-code start (2026-10-13), so dropping it put 939 existing
# S3776 issues into new code and failed the gate. Drop it again only after a confirming analysis shows that
# debt is no longer new code: with Previous version a projectVersion bump starts a new period; other
# new-code definitions need their own SonarCloud setting change.
sonar.issue.ignore.multicriteria.gocx.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.gocx.resourceKey=**/*.go
sonar.issue.ignore.multicriteria.rscx.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.rscx.resourceKey=desktop/src-tauri/**/*.rs
sonar.issue.ignore.multicriteria.jscx.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.jscx.resourceKey=desktop/ui/**/*js
sonar.issue.ignore.multicriteria.jscx2.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.jscx2.resourceKey=desktop/tests/**/*.cjs
sonar.issue.ignore.multicriteria.pycx1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.pycx1.resourceKey=tools/check_openapi.py
sonar.issue.ignore.multicriteria.pycx2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.pycx2.resourceKey=tools/update_api_contracts.py
sonar.issue.ignore.multicriteria.pycx3.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.pycx3.resourceKey=tools/check_release_quality.py
# Repeated literals are JSON wire keys and error codes; a named constant per key hides the wire format.
sonar.issue.ignore.multicriteria.golit.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.golit.resourceKey=**/*.go
