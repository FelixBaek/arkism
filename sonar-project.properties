# SonarCloud settings. CI: .github/workflows/sonarcloud.yml (CI-based analysis; automatic analysis stays OFF
# so these exclusions and reviewed ignores apply). sonar.projectVersion comes from desktop/src-tauri/tauri.conf.json.
# TODO(owner): create the SonarCloud project FelixBaek_arkism in organization felixbaek, turn automatic analysis off,
# and add the SONAR_TOKEN repository secret.
sonar.organization=felixbaek
sonar.projectKey=FelixBaek_arkism
sonar.projectName=Arkism
sonar.sources=.
sonar.exclusions=**/target/**,**/dist/**,**/*.lock,go.sum,desktop/src-tauri/icons/**,desktop/src-tauri/gen/**,desktop/ui/fonts/**,desktop/ui/img/**,**/testdata/**,**/*_test.go,**/*.test.js,tools/test_*.py
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.js,tools/test_*.py
# Coverage is Codecov's job (coverage.yml), so it is kept out of the SonarCloud quality gate.
sonar.coverage.exclusions=**/*

# Intentional exceptions. Each one names the rule, the files and the reason.
sonar.issue.ignore.multicriteria=gocx,golit,goargs,gopath,gopermhub,gopermskill,gopermclient,gohttpcrew,gohttpmail,gohttpgw,gohttplogin,gohttpsrc,rscx,jscx,jsternary,jscatch,jsoneline,jstpl,jsnest,jsinner,jsempty,jsneg,jschain,jsassign,jsmodern,jspath,pypath

# Cognitive complexity: protocol, recovery and port code keeps each check sequence in one function
# so it reads top to bottom against its tests; splitting it would scatter the order that matters.
sonar.issue.ignore.multicriteria.gocx.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.gocx.resourceKey=**/*.go
sonar.issue.ignore.multicriteria.rscx.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.rscx.resourceKey=desktop/src-tauri/**/*.rs
sonar.issue.ignore.multicriteria.jscx.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.jscx.resourceKey=desktop/ui/**/*.js
# Repeated literals are JSON wire keys and error codes; a named constant per key hides the wire format.
sonar.issue.ignore.multicriteria.golit.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.golit.resourceKey=**/*.go
# Long parameter lists are on unexported helpers called from one or two places.
sonar.issue.ignore.multicriteria.goargs.ruleKey=go:S107
sonar.issue.ignore.multicriteria.goargs.resourceKey=**/*.go
# The host runs the user's own CLIs (git, gh, docker, claude, openssl, bash, schtasks, taskkill) from the user's PATH;
# Go's os/exec refuses matches in the current directory (exec.ErrDot), and whoever can write PATH already is the user.
sonar.issue.ignore.multicriteria.gopath.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.gopath.resourceKey=**/*.go
# 0755 replaces os.MkdirTemp's 0700 on installed skill folders, and marks the copied client binary executable;
# neither holds secrets.
sonar.issue.ignore.multicriteria.gopermhub.ruleKey=go:S2612
sonar.issue.ignore.multicriteria.gopermhub.resourceKey=internal/host/skills/hub.go
sonar.issue.ignore.multicriteria.gopermskill.ruleKey=go:S2612
sonar.issue.ignore.multicriteria.gopermskill.resourceKey=internal/host/skills/skillinstall.go
sonar.issue.ignore.multicriteria.gopermclient.ruleKey=go:S2612
sonar.issue.ignore.multicriteria.gopermclient.resourceKey=internal/host/capture/install_win.go
# Clear-text HTTP only on loopback: the crew default public URL is the 127.0.0.1 listen address, the gateway address is
# checked against ^127\.0\.0\.1:port$, and the login replay goes to the CLI's redirect after it is checked to be
# localhost/127.0.0.1. skillinstall.go only strips an "http://" prefix from a typed GitHub address.
# Mail uses STARTTLS when offered, as smtp.SendMail does, and smtp.PlainAuth refuses to send a password without TLS.
sonar.issue.ignore.multicriteria.gohttpcrew.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.gohttpcrew.resourceKey=internal/crewrun/daemon.go
sonar.issue.ignore.multicriteria.gohttpmail.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.gohttpmail.resourceKey=internal/crewrun/notify.go
sonar.issue.ignore.multicriteria.gohttpgw.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.gohttpgw.resourceKey=internal/host/crew/gatewayctl.go
sonar.issue.ignore.multicriteria.gohttplogin.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.gohttplogin.resourceKey=internal/host/skills/agents.go
sonar.issue.ignore.multicriteria.gohttpsrc.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.gohttpsrc.resourceKey=internal/host/skills/skillinstall.go

# The desktop UI is plain JavaScript without a build step, written in a compact style.
# These rules are style preferences that conflict with it; behaviour rules stay on.
sonar.issue.ignore.multicriteria.jsternary.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.jsternary.resourceKey=desktop/ui/**/*.js
# UI reads are best effort: a failed call keeps the previous view or shows its own message.
sonar.issue.ignore.multicriteria.jscatch.ruleKey=javascript:S2486
sonar.issue.ignore.multicriteria.jscatch.resourceKey=desktop/ui/**/*.js
# One-line "if (x) a; b;" statements; each was read and the second statement is meant to run always.
sonar.issue.ignore.multicriteria.jsoneline.ruleKey=javascript:S2681
sonar.issue.ignore.multicriteria.jsoneline.resourceKey=desktop/ui/**/*.js
sonar.issue.ignore.multicriteria.jstpl.ruleKey=javascript:S4624
sonar.issue.ignore.multicriteria.jstpl.resourceKey=desktop/ui/**/*.js
sonar.issue.ignore.multicriteria.jsnest.ruleKey=javascript:S2004
sonar.issue.ignore.multicriteria.jsnest.resourceKey=desktop/ui/**/*.js
# Inner functions stay next to the one view that uses them.
sonar.issue.ignore.multicriteria.jsinner.ruleKey=javascript:S7721
sonar.issue.ignore.multicriteria.jsinner.resourceKey=desktop/ui/**/*.js
sonar.issue.ignore.multicriteria.jsempty.ruleKey=javascript:S7744
sonar.issue.ignore.multicriteria.jsempty.resourceKey=desktop/ui/**/*.js
sonar.issue.ignore.multicriteria.jsneg.ruleKey=javascript:S1940
sonar.issue.ignore.multicriteria.jsneg.resourceKey=desktop/ui/**/*.js
sonar.issue.ignore.multicriteria.jschain.ruleKey=javascript:S6582
sonar.issue.ignore.multicriteria.jschain.resourceKey=desktop/ui/**/*.js
sonar.issue.ignore.multicriteria.jsassign.ruleKey=javascript:S1121
sonar.issue.ignore.multicriteria.jsassign.resourceKey=desktop/ui/**/*.js
# Newer-syntax suggestions (findLast, at, String.raw, catch names); the UI targets the WebView2 baseline as written.
sonar.issue.ignore.multicriteria.jsmodern.ruleKey=javascript:S77*
sonar.issue.ignore.multicriteria.jsmodern.resourceKey=desktop/ui/**/*.js

# Developer and CI tools that read only the path their operator passes on the command line and print a report.
sonar.issue.ignore.multicriteria.jspath.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.jspath.resourceKey=desktop/ui/i18n-extract.js
sonar.issue.ignore.multicriteria.pypath.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pypath.resourceKey=tools/check_core_coverage.py
