# Plain HTTP only on loopback: the crew daemon refuses non-loopback listen addresses, gatewayctl accepts only 127.0.0.1:<port>,
# the CLI sign-in redirect is checked to be localhost/127.0.0.1, and skillinstall only strips a URL prefix.
sonar.issue.ignore.multicriteria.gohttp1.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.gohttp1.resourceKey=internal/crewrun/daemon.go
