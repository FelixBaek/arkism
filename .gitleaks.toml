# gitleaks: real secrets must never be in this repo. Only test code and test fixtures carry fake values
# (sk-test-…, AKIA…EXAMPLE, FAKEKEYDATA, sha256 record keys) — they are allowed here and nowhere else.
[extend]
useDefault = true

[[allowlists]]
description = "fake values in tests and test fixtures"
paths = [
  '''(^|/)[^/]+_test\.go$''',
  '''(^|/)internal/host/capture/testdata/(autosave_extract|evidence_hints|handoff_key)\.json$''',
  '''(^|/)internal/host/skills/testdata/hub\.json$''',
]

# Match the exact hash field, not an entire line or arbitrary 64-hex secrets.
[[allowlists]]
description = "public tokenizer artifact digest (not a credential)"
regexTarget = "match"
regexes = ['''^tokenizer_sha256"\s*:\s*"[a-f0-9]{64}"$''']

[[allowlists]]
description = "sha256 digest of a project key in eval fixtures (a hash, not the key)"
regexTarget = "match"
regexes = ['''^project_key_sha256"\s*:\s*"[a-f0-9]{64}"$''']
