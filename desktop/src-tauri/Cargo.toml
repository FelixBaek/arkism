[package]
name = "arkism-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Arkism desktop app: the screens for the shared agent memory and skills, talking to the Arkism API"
license = "MIT"

# The shell does one job besides showing the UI: it makes the HTTP calls to the
# Arkism API, so the WebView needs no CORS opening on the server and the
# owner token never leaves this process for anything but that API.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
