[package]
name = "arkism-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Arkism desktop app: the screens for the shared agent memory and skills, talking to the Arkism API"
license = "MIT"

# The shell does one job besides showing the UI: it makes the HTTP calls to the
# Arkism API, so the WebView needs no CORS opening on the server and the
# owner token never leaves this process for anything but that API.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
minisign-verify = "=0.3.0"

[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
# The SSH login password, kept in the OS credential store (never in a file): Windows Credential
# Manager, macOS Keychain, the Secret Service on Linux.
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
